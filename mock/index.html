<script src="./motion.js"></script>
<script src="./mock-data.js"></script>
<script>
(function () {
  "use strict";
  var M = window.MOCK;
  var LOOP_LABEL = { idle: "대기", running: "실행 중", waiting: "응답 대기", paused: "일시정지", done: "완료", stopped: "중단" };
  function $(id) { return document.getElementById(id); }
  function esc(t) {
    return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function byId(list, id) { return list.filter(function (x) { return x.id === id; })[0] || null; }
  function short(model) { return String(model || "").split("/").pop(); }
  function clip(t, n) { return t.length > n ? t.slice(0, n - 1) + "…" : t; }
  function now() { return new Date().toTimeString().slice(0, 5); }
  function setHTML(el, markup) {
    var doc = new DOMParser().parseFromString(markup, "text/html");
    if (!el) return;
    el.replaceChildren.apply(el, Array.prototype.slice.call(doc.body.childNodes));
  }
  function setSvg(el, markup) {
    var doc = new DOMParser().parseFromString(
      '<svg xmlns="http://www.w3.org/2000/svg">' + markup + "</svg>",
      "image/svg+xml"
    );
    var root = document.importNode(doc.documentElement, true);
    el.replaceChildren.apply(el, Array.prototype.slice.call(root.childNodes));
  }

  var STATE_LABEL = { running: "실행 중", done: "완료", idle: "대기", failed: "실패" };
  var VIEW_META = {
    board: ["상태 보드", "그룹 안 레포·워크트리와 관리 세션, 머지·루프 관계"],
    chat: ["채팅", "세션 메시지 열람과 프롬프트 전송"],
    orch: ["오케스트레이션", "run · task · worker 조회 (읽기 전용)"],
    history: ["히스토리", "로컬 세션 본문 검색 · 인덱싱 진행"]
  };

  var state = {
    view: "board", selected: { type: null, id: null }, chat: M.sessions[0].id,
    group: (M.groups.filter(function (g) { return "#" + g.id === location.hash; })[0] || M.groups[0]).id,
    closed: {}, sideOpenWt: null, histOpen: {}, orca: true,
    run: M.runs[0].id, worker: M.workers[0].id, query: "", range: "30", results: null, indexed: 0,
    zoom: 1, vx: 0, vy: 0, boardW: 0, boardH: 0, nodePts: [], pan: null, dragMoved: false, _lastGroup: null,
    inspChatH: 280,
    repo: M.repos[0]
  };

  function pill(st) {
    return '<span class="pill ' + st + '"><span class="d"></span>' + esc(STATE_LABEL[st] || st) + "</span>";
  }

  function groupWts(gid) {
    return M.worktrees.filter(function (w) { return w.group === gid; });
  }
  function activeSessions() {
    return M.sessions.filter(function (s) { return !s.removed; });
  }
  function groupSessions(gid) {
    var ids = {};
    groupWts(gid).forEach(function (w) { ids[w.id] = 1; });
    return activeSessions().filter(function (s) { return ids[s.wt]; });
  }
  function sessionRoot(wid) {
    var list = activeSessions().filter(function (s) { return s.wt === wid; });
    for (var i = 0; i < list.length; i++) {
      var p = list[i].parent ? byId(M.sessions, list[i].parent) : null;
      if (!p || p.wt !== wid) return list[i];
    }
    return list[0] || null;
  }
  function defaultChat(gid) {
    var g = byId(M.groups, gid);
    if (g && g.hubSessionId) {
      var h = byId(M.sessions, g.hubSessionId);
      if (h && !h.removed) return h;
    }
    var list = groupSessions(gid);
    return list[0] || null;
  }
  function chatTarget() {
    var sel = state.selected;
    if (sel && sel.type === "session") {
      var s = byId(M.sessions, sel.id);
      if (s) {
        if (s.group) state.group = s.group;
        return s;
      }
    }
    if (sel && sel.type === "wt") {
      var w = byId(M.worktrees, sel.id);
      if (w) {
        state.group = w.group;
        return sessionRoot(w.id) || defaultChat(w.group);
      }
    }
    var cur = byId(M.sessions, state.chat);
    if (cur && cur.group === state.group && !cur.removed) return cur;
    return defaultChat(state.group);
  }
  function descendants(wid) {
    var out = [], queue = [wid];
    while (queue.length) {
      var cur = queue.shift();
      M.worktrees.forEach(function (w) {
        if (w.parent === cur && out.indexOf(w.id) < 0) { out.push(w.id); queue.push(w.id); }
      });
    }
    return out;
  }

  function renderSidebar() {
    var selSess = state.selected.type === "session" ? byId(M.sessions, state.selected.id) : null;
    var rows = M.groups.map(function (g) {
      var wts = groupWts(g.id), closed = !!state.closed[g.id];
      var body = wts.map(function (w) {
        var ss = activeSessions().filter(function (s) { return s.wt === w.id; });
        var st = ss.filter(function (s) { return s.state === "running"; }).length ? "running"
          : ss.filter(function (s) { return s.state === "failed"; }).length ? "failed" : "done";
        var sel = state.selected.type === "wt" && state.selected.id === w.id ? " is-sel" : "";
        var isOpen = state.sideOpenWt === w.id;
        var list = isOpen ? '<div class="wt-sess">' + (ss.length ? ss.map(function (s) {
          var on = selSess && selSess.id === s.id ? " is-sel" : "";
          return '<button class="wt-sess-row' + on + '" data-sess="' + s.id + '">'
            + '<span class="d ' + s.state + '"></span>'
            + '<span class="wt-sess-name">' + esc(s.title) + "</span>"
            + '<span class="wt-sess-time">' + esc(s.last) + "</span></button>";
        }).join("") : '<div class="wt-sess-empty">세션 없음</div>') + "</div>" : "";
        return '<div class="wt-item">'
          + '<button class="wt-row' + sel + '" data-wt="' + w.id + '" aria-expanded="' + (isOpen ? "true" : "false") + '">'
          + '<span class="d ' + st + '"></span>'
          + '<span class="wt-name">' + esc(w.repo) + ' · ' + esc(w.branch) + "</span>"
          + (w.dirty ? '<span class="wt-dirty">미커밋</span>' : "")
          + '<span class="wt-chev">' + (isOpen ? "▾" : "▸") + "</span></button>"
          + list + "</div>";
      }).join("");
      return '<div class="grp' + (closed ? " is-closed" : "") + (state.group === g.id ? " is-active" : "")
        + (state.openAnim === g.id ? " is-open-anim" : "") + (state.flash === g.id ? " is-flash" : "") + '">'
        + '<button class="grp-head" data-grp="' + g.id + '"><span class="chev">▾</span><span>' + esc(g.name) + "</span>"
        + '<em>' + esc(g.note) + "</em>"
        + '<span class="grp-more" data-grp-edit="' + g.id + '" title="그룹 편집">⋯</span>'
        + "<b>" + wts.length + "</b></button>"
        + '<div class="grp-body">' + body + "</div></div>";
    }).join("");
    setHTML($("wt-list"), rows);
    state.openAnim = null;
    state.flash = null;
    $("wt-count").textContent = M.groups.length;
    [].forEach.call($("wt-list").querySelectorAll("[data-grp]"), function (b) {
      b.onclick = function () {
        var gid = b.getAttribute("data-grp");
        if (state.group === gid) state.closed[gid] = !state.closed[gid];
        else state.flash = gid;
        if (!state.closed[gid]) state.openAnim = gid;
        if (state.group !== gid) {
          state.group = gid;
          state.sideOpenWt = null;
          state.selected = { type: null, id: null };
          state.chat = (defaultChat(gid) || {}).id || null;
          state.query = ""; state.results = null;
          if ($("search")) $("search").value = "";
        }
        if (state.view === "chat") { renderSidebar(); renderChat(); return; }
        if (state.view === "orch") { renderSidebar(); renderOrch(); return; }
        if (state.view === "history") { renderSidebar(); renderHistory(); return; }
        renderBoard();
      };
    });
    [].forEach.call($("wt-list").querySelectorAll("[data-grp-edit]"), function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        groupEditDialog(b.getAttribute("data-grp-edit"));
      };
    });
    [].forEach.call($("wt-list").querySelectorAll("[data-wt]"), function (b) {
      b.onclick = function () {
        var wid = b.getAttribute("data-wt");
        var w = byId(M.worktrees, wid);
        state.group = w.group;
        state.selected = { type: "wt", id: wid };
        var root = sessionRoot(wid);
        state.chat = root ? root.id : null;
        state.sideOpenWt = state.sideOpenWt === wid ? null : wid;
        if (state.view === "chat") { renderSidebar(); renderChat(); return; }
        if (state.view === "orch") { renderSidebar(); renderOrch(); return; }
        if (state.view === "history") { renderSidebar(); renderHistory(); return; }
        setView("board");
      };
    });
    [].forEach.call($("wt-list").querySelectorAll("[data-sess]"), function (b) {
      b.onclick = function () {
        var sid = b.getAttribute("data-sess");
        var s = byId(M.sessions, sid);
        if (!s) return;
        state.group = s.group;
        state.selected = { type: "session", id: sid };
        state.chat = sid;
        if (state.view === "chat") { renderChat(); renderSidebar(); return; }
        if (state.view === "orch") { renderSidebar(); renderOrch(); return; }
        if (state.view === "history") { setView("chat"); renderSidebar(); return; }
        renderBoard();
      };
    });
  }

  function renderTop() {
    var acts = {
      board: '<button class="btn" data-act="wt-new">워크트리</button><button class="btn primary" data-act="s-new">새 세션</button>',
      chat: "", orch: "", history: ""
    }[state.view];
    setHTML($("top-actions"), acts);
    [].forEach.call($("top-actions").querySelectorAll("[data-act]"), function (b) {
      b.onclick = function () {
        if (b.getAttribute("data-act") === "wt-new") return worktreeDialog();
        newSessionDialog();
      };
    });
  }

  function setView(v) {
    state.view = v;
    [].forEach.call(document.querySelectorAll(".view"), function (s) { s.classList.add("hidden"); });
    $("view-" + v).classList.remove("hidden");
    [].forEach.call(document.querySelectorAll(".nav-item"), function (b) {
      b.classList.toggle("is-active", b.getAttribute("data-view") === v);
    });
    $("view-title").textContent = VIEW_META[v][0];
    $("view-sub").textContent = VIEW_META[v][1];
    renderTop();
    if (v === "board") renderBoard();
    if (v === "chat") renderChat();
    if (v === "orch") renderOrch();
    if (v === "history") renderHistory();
  }

  function banner() {
    $("banner").classList.toggle("hidden", state.orca);
    $("tb-status").className = "pill" + (state.orca ? "" : " err");
    $("tb-status-text").textContent = state.orca ? "Orca 연결됨" : "Orca 연결 없음";
  }
  function setOrca(on) {
    state.orca = on;
    banner();
    $("orca-toggle").textContent = on ? "Orca 연결 끊기" : "Orca 다시 연결";
    setView(state.view);
    toast(on ? "Orca에 연결했습니다 (목업)" : "Orca 연결을 끊었습니다 (목업)");
  }

  /* ---------- board ---------- */
  var G = { pad: 16, colW: 206, gap: 14, head: 46, rowH: 36, chipH: 18, hubH: 52 };

  function hubOf(wts) {
    var own = {}, best = null;
    wts.forEach(function (w) { own[w.id] = 1; });
    var g = wts.length ? byId(M.groups, wts[0].group) : null;
    if (g && g.hubSessionId) {
      var h = byId(M.sessions, g.hubSessionId);
      if (h && !h.removed) return h;
    }
    activeSessions().forEach(function (s) {
      if (!own[s.wt]) return;
      var spread = {};
      activeSessions().forEach(function (k) {
        if (k.parent === s.id && k.wt !== s.wt && own[k.wt]) spread[k.wt] = 1;
      });
      if (Object.keys(spread).length >= 2) best = s;
    });
    return best;
  }

  function lastTool(s) {
    var msgs = M.messages[s.id] || [];
    for (var i = msgs.length - 1; i >= 0; i--) if (msgs[i].role === "tool") return msgs[i];
    return null;
  }
  function toolName(t) {
    return (t.text.split("\n")[0] || "").replace(/\s*×.*$/, "").trim();
  }
  var toolCtx = null;
  function toolTextW(s) {
    if (!toolCtx) toolCtx = document.createElement("canvas").getContext("2d");
    toolCtx.font = "8.5px Geist, -apple-system, 'Segoe UI', sans-serif";
    return toolCtx.measureText(s).width;
  }

  function rowsOf(wid, skip, startY) {
    var rows = [], y = startY;
    activeSessions().filter(function (s) {
      return s.wt === wid && s.id !== skip;
    }).sort(function (a, b) { return a.started < b.started ? -1 : 1; }).forEach(function (s) {
      var tool = lastTool(s);
      rows.push({ s: s, tool: tool, y: y });
      y += G.rowH + (tool ? G.chipH : 0);
    });
    return rows;
  }

  function rowsEnd(rows, fallback) {
    if (!rows.length) return fallback;
    var last = rows[rows.length - 1];
    return last.y + G.rowH + (last.tool ? G.chipH : 0);
  }

  function boardCols(wts, skip, top) {
    var x = G.pad, cols = [];
    wts.forEach(function (wt) {
      var rows = rowsOf(wt.id, skip, top + G.head + 4);
      cols.push({ wt: wt, x: x, y: top, w: G.colW, h: Math.max(rowsEnd(rows, top + G.head + 4) - top + 8, G.head + 42), rows: rows });
      x += G.colW + G.gap;
    });
    return cols;
  }

  function renderBoard() {
    if (state._lastGroup !== state.group) {
      state._lastGroup = state.group;
      resetView();
    }
    renderSidebar();
    var wts = groupWts(state.group);
    if (!wts.length) {
      state.boardW = 0;
      state.boardH = 0;
      state.nodePts = [];
      $("graph").setAttribute("viewBox", "0 0 900 480");
      setSvg($("graph"), '<text x="24" y="48" fill="#737373" font-size="12">빈 그룹 — 워크트리를 추가하세요.</text>');
      $("n-board").textContent = "0";
      renderInspector();
      return;
    }
    var rootWt = wts.filter(function (w) {
      return wts.some(function (x) { return x.parent === w.id; });
    })[0] || null;
    var hub = rootWt ? null : hubOf(wts);
    var children = wts.filter(function (w) { return !rootWt || w.id !== rootWt.id; });
    var totalW = children.length ? children.length * (G.colW + G.gap) - G.gap + G.pad * 2 : 320;

    var root = null, childTop = G.pad + (hub ? G.hubH + 64 : 0);
    if (rootWt) {
      var rr = rowsOf(rootWt.id, null, G.pad + G.head + 4);
      root = {
        wt: rootWt, x: G.pad, y: G.pad, w: totalW - G.pad * 2,
        h: Math.max(rowsEnd(rr, G.pad + G.head + 4) - G.pad + 8, G.head + 42), rows: rr
      };
      childTop = G.pad + root.h + 64;
    }

    var cols = boardCols(children, hub, childTop);
    var all = root ? [root].concat(cols) : cols;
    var pos = {};
    all.forEach(function (c) {
      c.rows.forEach(function (r) { pos[r.s.id] = { x: c.x + 20, y: r.y + 9, col: c }; });
    });

    var svg = [];
    svg.push('<defs>'
      + '<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">'
      + '<path d="M0 0 L10 5 L0 10 z" fill="#51a2ff"/></marker>'
      + '<marker id="arwl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">'
      + '<path d="M0 0 L10 5 L0 10 z" fill="#d4a300"/></marker></defs>');

    var edgeN = 0;
    function edge(d, color, active, arrow, dash, dots) {
      var id = "e" + (++edgeN);
      var out = '<path id="' + id + '" d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.6"'
        + (active ? ' class="edge-flow"' : dash ? ' class="edge-dash"' : "")
        + (arrow ? ' marker-end="url(#' + arrow + ')"' : "") + "/>";
      if (!active || !dots) return out;
      var n = dots === 3 ? 3 : 1;
      var radii = n === 3 ? [2.4, 1.8, 1.2] : [2.6];
      var ops = n === 3 ? [0.9, 0.55, 0.28] : [0.9];
      for (var i = 0; i < n; i++) {
        out += '<circle class="edge-dot" r="' + radii[i] + '" fill="' + color + '" opacity="' + ops[i] + '"><animateMotion dur="2.4s"'
          + (i ? ' begin="-' + i * 0.25 + 's"' : "") + ' repeatCount="indefinite"><mpath href="#' + id + '"/></animateMotion></circle>';
      }
      return out;
    }

    function liveWt(wid) {
      return activeSessions().some(function (s) { return s.wt === wid && s.state === "running"; });
    }

    var hubX = G.pad, hubY = G.pad, hubW = totalW - G.pad * 2;
    var topBottom = root ? root.y + root.h : hub ? G.pad + G.hubH : 0;
    var topCenter = root ? root.x + root.w / 2 : G.pad + hubW / 2;
    if ((root || hub) && cols.length) {
      var busY = topBottom + 16;
      var centers = cols.map(function (c) { return c.x + c.w / 2; });
      var left = Math.min.apply(null, centers.concat([topCenter]));
      var right = Math.max.apply(null, centers.concat([topCenter]));
      var topLive = root ? liveWt(root.wt.id) : hub.state === "running";
      var trunkLive = MOTION.allLive([topLive].concat(cols.map(function (c) { return liveWt(c.wt.id); })));
      svg.push(edge("M" + topCenter + " " + topBottom + " L" + topCenter + " " + busY + " L" + right + " " + busY, "#525252", trunkLive, null));
      svg.push(edge("M" + topCenter + " " + busY + " L" + left + " " + busY, "#525252", trunkLive, null));
      cols.forEach(function (c) {
        var cx = c.x + c.w / 2;
        svg.push(edge("M" + cx + " " + busY + " L" + cx + " " + c.y, "#525252", MOTION.allLive([topLive, liveWt(c.wt.id)]), null));
      });
    }

    var overlay = [];
    var bottomExtra = 0;
    activeSessions().forEach(function (s) {
      var p = pos[s.id];
      if (!p) return;
      if (s.loop) {
        overlay.push('<circle cx="' + p.x + '" cy="' + p.y + '" r="14" fill="none" stroke="#d4a300" stroke-width="1.6" stroke-dasharray="4 4"'
          + (s.state === "running" ? ' class="loop-ring"' : "") + "/>");
        var arc = 'M' + (p.x - 4.8) + ' ' + (p.y - 13.2) + ' A 14 14 0 0 1 ' + (p.x + 4.8) + ' ' + (p.y - 13.2);
        overlay.push('<path class="loop-arc" d="' + arc + '" fill="none" stroke="#d4a300" stroke-width="1.6" marker-end="url(#arwl)"/>');
        overlay.push('<text x="' + (p.x - 2) + '" y="' + (p.y - 18) + '" fill="#d4a300" font-size="9" font-weight="600">loop</text>');
      }
      if (s.mergeTo) {
        var moving = s.state === "running";
        if (root) {
          var cxr = p.col.x + p.col.w / 2, busYr = topBottom + 16;
          overlay.push(edge("M" + cxr + " " + p.col.y + " L" + cxr + " " + busYr + " L" + topCenter + " " + busYr
            + " L" + topCenter + " " + (root.y + root.h), "#d4a300", moving, "arwl", true, 3));
          overlay.push('<text x="' + (topCenter + 12) + '" y="' + (busYr - 5) + '" fill="#d4a300" font-size="9">merge</text>');
          return;
        }
        var t = cols.filter(function (c) { return c.wt.id === s.mergeTo; })[0];
        if (!t) return;
        var sx = p.col.x + p.col.w, ex = t.x + t.w / 2, laneY = Math.max(p.col.y + p.col.h, t.y + t.h) + 14;
        overlay.push(edge("M" + sx + " " + p.y + " L" + (sx + 9) + " " + p.y + " L" + (sx + 9) + " " + laneY
          + " L" + ex + " " + laneY + " L" + ex + " " + (t.y + t.h), "#d4a300", moving, "arwl", true, 3));
        overlay.push('<text x="' + ((sx + 9 + ex) / 2) + '" y="' + (laneY - 6) + '" fill="#d4a300" font-size="9" text-anchor="middle">merge</text>');
        bottomExtra = Math.max(bottomExtra, laneY);
      }
    });

    if (hub) {
      svg.push('<g class="node" data-session="' + hub.id + '">'
        + '<rect x="' + hubX + '" y="' + hubY + '" width="' + hubW + '" height="' + G.hubH + '" rx="10" fill="#171717" stroke="#ffffff1f"/>'
        + '<circle cx="' + (hubX + 18) + '" cy="' + (hubY + 19) + '" r="4" fill="#d4a300"/>'
        + '<text x="' + (hubX + 30) + '" y="' + (hubY + 23) + '" fill="#f0f0f0" font-size="12" font-weight="600">' + esc(hub.title) + '</text>'
        + '<text x="' + (hubX + hubW - 14) + '" y="' + (hubY + 23) + '" fill="#737373" font-size="9.5" text-anchor="end">' + wts.length + ' 레포 관리</text>'
        + '<text x="' + (hubX + 18) + '" y="' + (hubY + 41) + '" fill="#737373" font-size="9.5">'
        + esc(short(hub.model)) + " · " + esc(hub.started) + " · " + Math.round(hub.tokens / 1000) + "k</text></g>");
    }

    all.forEach(function (c) {
      var cardSel = state.selected.type === "wt" && state.selected.id === c.wt.id ? " is-sel" : "";
      svg.push('<g class="wt-col" data-wt="' + c.wt.id + '">');
      svg.push('<rect class="wt-card' + cardSel + '" x="' + c.x + '" y="' + c.y + '" width="' + c.w + '" height="' + c.h + '" rx="10" fill="#171717" stroke="#ffffff12"/>');
      if (c.wt.dirty) svg.push('<circle class="dirty-dot" cx="' + (c.x + c.w - 9) + '" cy="' + (c.y + 12) + '" r="2.5" fill="#d4a300"/>');
      svg.push('<text x="' + (c.x + 12) + '" y="' + (c.y + 17) + '" fill="#737373" font-size="10">' + esc(c.wt.repo) + '</text>');
      svg.push('<text x="' + (c.x + 12) + '" y="' + (c.y + 33) + '" fill="#f0f0f0" font-size="12" font-weight="600">' + esc(c.wt.branch) + '</text>');
      svg.push('<text x="' + (c.x + c.w - 12) + '" y="' + (c.y + 33) + '" fill="#737373" font-size="9.5" text-anchor="end">'
        + c.rows.length + " 세션" + (c.wt.dirty ? " · 미커밋" : "") + "</text>");
      if (!c.rows.length) {
        svg.push('<text x="' + (c.x + c.w / 2) + '" y="' + (c.y + G.head + 16) + '" fill="#737373" font-size="10.5" text-anchor="middle">세션 없음</text>');
      }
      c.rows.forEach(function (r) {
        var s = r.s;
        var sel = state.selected.type === "session" && state.selected.id === s.id;
        var fill = s.state === "failed" ? "#ff656826" : s.state === "running" ? "#d4a30026" : s.state === "idle" ? "#73737326" : "#10b98126";
        var stroke = s.state === "failed" ? "#ff6568" : s.state === "running" ? "#d4a300" : s.state === "idle" ? "#a3a3a3" : "#51a2ff";
        svg.push('<g class="node' + (sel ? " is-sel" : "") + '" data-session="' + s.id + '">');
        if (s.state === "running" && !s.loop) svg.push('<circle class="node-ring" cx="' + (c.x + 20) + '" cy="' + (r.y + 9) + '" r="5" fill="none" stroke="' + stroke + '" stroke-width="1.3"/>');
        svg.push('<circle cx="' + (c.x + 20) + '" cy="' + (r.y + 9) + '" r="5" fill="' + fill + '" stroke="' + stroke + '" stroke-width="1.4"/>');
        svg.push('<text x="' + (c.x + 32) + '" y="' + (r.y + 13) + '" fill="#f0f0f0" font-size="11">' + esc(clip(s.title, 19)) + '</text>');
        svg.push('<text x="' + (c.x + 32) + '" y="' + (r.y + 26) + '" fill="#737373" font-size="9">'
          + esc(short(s.model)) + " · " + esc(s.started) + " · " + Math.round(s.tokens / 1000) + "k</text>");
        svg.push("</g>");
        if (!r.tool) return;
        var full = toolName(r.tool) || "도구";
        var maxW = c.w - 42;
        var label = full;
        var tw = Math.ceil(toolTextW(label)) + 10;
        if (tw > maxW) {
          var ell = "…";
          var avail = maxW - 10 - toolTextW(ell);
          while (label.length > 1 && toolTextW(label) > avail) label = label.slice(0, -1);
          label = label.trim() + ell;
          tw = maxW;
        }
        tw = Math.max(24, Math.min(maxW, tw));
        svg.push('<g class="node" data-tool="' + esc(full) + '">'
          + '<rect x="' + (c.x + 32) + '" y="' + (r.y + 30) + '" width="' + tw + '" height="15" rx="4" fill="#262626" stroke="#ffffff1f"/>'
          + '<text x="' + (c.x + 37) + '" y="' + (r.y + 41) + '" fill="#acacac" font-size="8.5">' + esc(label) + '</text></g>');
      });
      svg.push("</g>");
    });

    var maxBottom = G.pad;
    all.forEach(function (c) { maxBottom = Math.max(maxBottom, c.y + c.h); });
    svg.push(overlay.join(""));
    state.boardW = totalW;
    state.boardH = Math.max(maxBottom, bottomExtra) + G.pad;
    state.nodePts = Object.keys(pos).map(function (k) { return pos[k]; });
    applyView();
    setSvg($("graph"), svg.join(""));
    $("n-board").textContent = activeSessions().length;
    renderInspector();
  }

  function resetView() {
    state.zoom = 1;
    state.vx = 0;
    state.vy = 0;
  }

  function applyView() {
    var W = state.boardW, H = state.boardH;
    if (!W || !H) return;
    var vw = W / state.zoom, vh = H / state.zoom;
    var vx = vw >= W ? (W - vw) / 2 : Math.min(Math.max(state.vx, 0), W - vw);
    var vy = vh >= H ? (H - vh) / 2 : Math.min(Math.max(state.vy, 0), H - vh);
    var pts = state.nodePts || [];
    if (vw < W && pts.length && !pts.some(function (p) {
      return p.x >= vx && p.x <= vx + vw && p.y >= vy && p.y <= vy + vh;
    })) {
      var best = pts[0], bd = Infinity;
      pts.forEach(function (p) {
        var cx = Math.min(Math.max(p.x, vx), vx + vw);
        var cy = Math.min(Math.max(p.y, vy), vy + vh);
        var d = Math.abs(p.x - cx) + Math.abs(p.y - cy);
        if (d < bd) { bd = d; best = p; }
      });
      if (best.x < vx) vx = best.x - 8;
      else if (best.x > vx + vw) vx = best.x - vw + 8;
      if (best.y < vy) vy = best.y - 8;
      else if (best.y > vy + vh) vy = best.y - vh + 8;
      vx = Math.min(Math.max(vx, 0), W - vw);
      vy = Math.min(Math.max(vy, 0), H - vh);
    }
    state.vx = vx;
    state.vy = vy;
    $("graph").setAttribute("viewBox", vx + " " + vy + " " + vw + " " + vh);
  }

  function setZoom(next) {
    var W = state.boardW, H = state.boardH;
    if (!W || !H) return;
    var z = Math.min(3, Math.max(0.5, next));
    if (Math.abs(z - state.zoom) < 0.001) return;
    var vw = W / state.zoom, vh = H / state.zoom;
    var cx = state.vx + vw / 2, cy = state.vy + vh / 2;
    state.zoom = z;
    state.vx = cx - W / z / 2;
    state.vy = cy - H / z / 2;
    applyView();
  }

  function inspChatHTML(s) {
    var msgs = M.messages[s.id] || [];
    var turns = turnsOf(msgs);
    var log = turns.length ? turns.map(function (t, i) { return turnHTML(t, i === turns.length - 1, s); }).join("")
      : '<p class="empty">저장된 메시지가 없습니다.</p>';
    var ro = !state.orca || s.removed;
    return '<section class="insp-chat">'
      + '<h3>채팅<span class="insp-chat-n">' + msgs.length + '개 메시지</span></h3>'
      + '<div class="insp-thread" id="insp-thread" style="height:' + state.inspChatH + 'px">' + log + '</div>'
      + '<div class="insp-resize" id="insp-resize" role="separator" aria-label="채팅 높이 조절" title="끌어서 높이 조절"></div>'
      + '<form class="insp-form" id="insp-form"><textarea id="insp-input" rows="2" placeholder="'
      + (s.removed ? '삭제된 세션 — 기록만 표시합니다' : state.orca ? '프롬프트를 입력하세요 (Enter 전송)' : 'Orca 연결 없음 — 보낼 수 없습니다')
      + '"' + (ro ? ' disabled' : '') + '></textarea>'
      + '<button class="btn primary" type="submit"' + (ro ? ' disabled' : '') + '>전송</button></form>'
      + '</section>';
  }

  function renderInspector() {
    var box = $("inspector");
    if (state.selected.type === "wt") {
      var wt = byId(M.worktrees, state.selected.id);
      if (!wt) { setHTML(box, '<p class="empty">선택된 항목이 없습니다.</p>'); return; }
      var parent = wt.parent ? byId(M.worktrees, wt.parent) : null;
      var group = byId(M.groups, wt.group);
      var wtSessions = activeSessions().filter(function (s) { return s.wt === wt.id; });
      setHTML(box,
        '<div class="insp-head"><h2>' + esc(wt.name) + '</h2><span class="pill">워크트리</span></div>'
        + '<dl class="kv"><dt>브랜치</dt><dd class="mono">' + esc(wt.branch) + "</dd>"
        + "<dt>상위</dt><dd>" + (parent ? esc(parent.name) : "—") + "</dd>"
        + "<dt>미커밋</dt><dd>" + (wt.dirty ? "있음" : "없음") + "</dd>"
        + "<dt>세션</dt><dd>" + wtSessions.length + "개</dd></dl>"
        + (wtSessions.length ? '<section class="insp-tools"><h3>세션별 최근 도구</h3>'
          + wtSessions.map(function (s) {
              var t = lastTool(s);
              return '<div class="tool-row"><span class="tool-sess">' + esc(clip(s.title, 18)) + '</span>'
                + '<span class="tool-name mono">' + (t ? esc(clip(toolName(t), 22)) : "호출 없음") + '</span>'
                + '<span class="tool-meta">' + (t ? esc(t.at) : "") + "</span></div>";
            }).join("") + "</section>" : "")
        + '<div class="insp-actions">'
        + '<button class="btn" data-act="wt-rename">이름 수정</button>'
        + '<button class="btn" data-act="wt-parent">부모 변경</button>'
        + (group && !group.hubSessionId ? '<button class="btn" data-act="wt-hub">허브로 지정</button>' : "")
        + (wt.orcaMissing ? '<button class="btn" data-act="wt-orca">Orca 복구</button>' : "")
        + '<button class="btn danger" data-act="wt-del">삭제</button></div>');
      bindInspector();
      return;
    }
    var s = byId(M.sessions, state.selected.id);
    if (!s) { setHTML(box, '<p class="empty">노드를 선택하면 세션 상세가 보입니다.</p>'); return; }
    var swt = byId(M.worktrees, s.wt);
    var tool = lastTool(s);
    setHTML(box,
      '<div class="insp-head"><h2>' + esc(s.title) + "</h2>" + pill(s.state) + "</div>"
      + '<dl class="kv"><dt>모델</dt><dd class="mono">' + esc(s.model) + "</dd>"
      + "<dt>워크트리</dt><dd>" + esc((byId(M.worktrees, s.wt) || {}).name || s.wtName || s.wt) + "</dd>"
      + "<dt>시작</dt><dd>" + esc(s.started) + "</dd>"
      + "<dt>마지막 활동</dt><dd>" + esc(s.last) + "</dd>"
      + "<dt>토큰</dt><dd>" + s.tokens.toLocaleString() + "</dd>"
      + "<dt>세션 ID</dt><dd class=\"mono\">" + esc(s.id) + "</dd>"
      + "<dt>최근 도구</dt><dd>" + (tool ? '<span class="mono">' + esc(toolName(tool)) + "</span> · " + esc(tool.at) : "없음") + "</dd>"
      + "</dl>"
      + inspChatHTML(s)
      + '<div class="insp-actions">'
      + '<button class="btn primary" data-act="resume">재개</button>'
      + '<button class="btn" data-act="stop">중단</button>'
      + '<button class="btn" data-act="s-rename">이름 수정</button>'
      + '<button class="btn danger" data-act="s-del">제거</button></div>' + (swt && swt.loop ? loopInspector(swt) : ""));
    bindInspector();
  }

  function loopInspector(wt) {
    var L = wt.loop;
    var st = L.status;
    var cls = st === "running" || st === "waiting" ? "running" : st === "paused" ? "failed" : st === "done" ? "done" : "idle";
    var head = '<h3>Loop <span class="pill ' + cls + '"><span class="d"></span>' + esc(LOOP_LABEL[st] || st) + "</span></h3>";
    var startLabel = st === "running" ? "다음 회차" : st === "paused" ? "재개" : st === "stopped" ? "다시 시작" : "시작";
    return '<section class="insp-loop">' + head
      + '<p class="loop-meta">' + L.round + "/" + L.maxRounds + " 회차 · " + esc(L.lastEvent || "") + "</p>"
      + '<textarea id="insp-loop-prompt" rows="2" placeholder="매 회차 보낼 프롬프트">' + esc(L.prompt || "") + "</textarea>"
      + '<div class="loop-row"><input id="insp-loop-max" type="number" min="1" max="20" value="' + L.maxRounds + '" style="width:88px">'
      + '<button class="btn" data-loop-save>저장</button></div>'
      + '<div class="loop-row"><button class="btn primary" data-loop-act="start">' + startLabel + '</button>'
      + '<button class="btn" data-loop-act="pause">일시정지</button>'
      + '<button class="btn danger" data-loop-act="stop">중단</button></div></section>';
  }

  function bindInspector() {
    [].forEach.call($("inspector").querySelectorAll("[data-act]"), function (b) {
      b.onclick = function () {
        var act = b.getAttribute("data-act");
        if (!state.orca && act !== "s-rename" && act !== "s-del") return toast("Orca 연결이 없어 실행할 수 없습니다");
        if (act === "resume") return toast("목업: 재개 명령은 실제로 보내지 않습니다");
        if (act === "stop") return toast("목업: 중단 명령은 실제로 보내지 않습니다");
        if (act === "wt-rename") return worktreeRenameDialog(state.selected.id);
        if (act === "wt-parent") return worktreeParentDialog(state.selected.id);
        if (act === "wt-hub") return hubStart(state.selected.id);
        if (act === "wt-orca") return orcaDialog(state.selected.id);
        if (act === "wt-del") return worktreeDeleteDialog(state.selected.id);
        if (act === "s-rename") return sessionRenameDialog(state.selected.id);
        if (act === "s-del") return sessionDeleteDialog(state.selected.id);
      };
    });

    var inspForm = $("insp-form");
    if (inspForm) {
      inspForm.onsubmit = function (e) {
        e.preventDefault();
        var input = $("insp-input");
        var text = input.value.trim();
        if (!text || !state.orca) return;
        input.value = "";
        state.chat = state.selected.id;
        state.inspFocus = true;
        sendPrompt(text, renderInspector);
      };
      $("insp-input").addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); inspForm.dispatchEvent(new Event("submit", { cancelable: true })); }
      });
    }
    var handle = $("insp-resize");
    if (handle) {
      handle.onpointerdown = function (e) {
        e.preventDefault();
        var startY = e.clientY, startH = state.inspChatH, thread = $("insp-thread");
        handle.setPointerCapture(e.pointerId);
        handle.onpointermove = function (ev) {
          var h = Math.min(720, Math.max(120, startH + (ev.clientY - startY)));
          state.inspChatH = h;
          if (thread) thread.style.height = h + "px";
        };
        handle.onpointerup = function () {
          handle.onpointermove = null;
          handle.onpointerup = null;
          if (handle.releasePointerCapture) handle.releasePointerCapture(e.pointerId);
        };
      };
    }

    var inspThread = $("insp-thread");
    if (inspThread) inspThread.scrollTop = inspThread.scrollHeight;
    if (state.inspFocus) {
      state.inspFocus = false;
      var focusInput = $("insp-input");
      if (focusInput) focusInput.focus();
    }

    var selSess = state.selected.type === "session" ? byId(M.sessions, state.selected.id) : null;
    var wt = selSess ? byId(M.worktrees, selSess.wt) : null;
    var loopBox = $("inspector").querySelector(".insp-loop");
    if (!wt || !wt.loop || !loopBox) return;
    var read = function () {
      var p = $("insp-loop-prompt").value.trim();
      var max = Math.max(1, Math.min(20, parseInt($("insp-loop-max").value, 10) || 1));
      if (!p) { toast("프롬프트를 입력하세요"); return null; }
      return { prompt: p, maxRounds: max };
    };
    var save = function () {
      var v = read();
      if (!v) return;
      wt.loop = wt.loop || { round: 0, status: "idle" };
      wt.loop.prompt = v.prompt;
      wt.loop.maxRounds = v.maxRounds;
      wt.loop.lastEvent = now();
      renderInspector();
      renderBoard();
      toast("Loop 저장 — " + wt.name);
    };
    var saveBtn = loopBox.querySelector("[data-loop-save]");
    if (saveBtn) saveBtn.onclick = save;
    [].forEach.call(loopBox.querySelectorAll("[data-loop-act]"), function (b) {
      b.onclick = function () {
        var act = b.getAttribute("data-loop-act");
        wt.loop.status = act === "start" ? "running" : act === "pause" ? "paused" : "stopped";
        wt.loop.lastEvent = now();
        renderInspector();
        renderBoard();
        toast("Loop " + (act === "start" ? "시작" : act === "pause" ? "일시정지" : "중단") + " — " + wt.name);
      };
    });
  }

  /* ---------- chat ---------- */
  function renderChat() {
    var target = chatTarget();
    state.chat = target ? target.id : null;
    var pool = groupSessions(state.group);
    if (target && target.group === state.group && pool.indexOf(target) < 0) pool = [target].concat(pool);
    setHTML($("chat-list"), pool.map(function (x) {
      return '<button class="chat-item ' + x.state + (x.id === state.chat ? " is-active" : "") + '" data-chat="' + x.id + '">'
        + '<span class="d"></span><span>' + esc(x.title) + "</span></button>";
    }).join(""));
    [].forEach.call($("chat-list").querySelectorAll("[data-chat]"), function (b) {
      b.onclick = function () {
        var sid = b.getAttribute("data-chat");
        var s = byId(M.sessions, sid);
        state.chat = sid;
        if (s) { state.group = s.group || state.group; state.selected = { type: "session", id: sid }; }
        renderChat();
        renderSidebar();
      };
    });

    var s = target;
    if (!s) {
      $("chat-who").textContent = "세션 없음";
      $("chat-meta").textContent = "";
      setHTML($("chat-log"), '<p class="empty">세션이 없습니다. 새 세션을 시작하세요.</p>');
      return;
    }
    $("chat-who").textContent = s.title;
    var cp = $("chat-pill");
    cp.className = "pill " + (s.removed ? "idle" : s.state);
    setHTML(cp, '<span class="d"></span>' + (s.removed ? "삭제됨" : (STATE_LABEL[s.state] || s.state)));
    setHTML($("chat-meta"), esc(short(s.model)) + " · " + esc(s.started) + "–" + esc(s.last) + " · " + (s.removed ? "기록" : s.tokens.toLocaleString() + " tok"));

    var msgs = M.messages[s.id] || [];
    var turns = turnsOf(msgs);
    var log = turns.length ? turns.map(function (t, i) { return turnHTML(t, i === turns.length - 1, s); }).join("") : '<p class="empty">저장된 메시지가 없습니다.</p>';
    setHTML($("chat-log"), log);
    $("chat-log").scrollTop = $("chat-log").scrollHeight;

    var ro = !state.orca || s.removed;
    $("chat-input").disabled = ro;
    $("chat-send").disabled = ro;
    $("chat-input").placeholder = s.removed
      ? "삭제된 세션 — 기록만 표시합니다"
      : state.orca
        ? "프롬프트를 입력하세요 (Enter 전송 · Shift+Enter 줄바꿈)"
        : "Orca 연결 없음 — 프롬프트를 보낼 수 없습니다";
    $("chat-status").textContent = "";
    $("chat-status").className = "status";
  }

  function toolParts(text) {
    var lines = String(text || "").split("\n");
    return {
      name: lines[0] || "",
      out: lines.slice(1).join("\n").replace(/^→\s*/, "").trim()
    };
  }

  function toolIcon(name) {
    if (/playwright|test/i.test(name)) return "✓";
    if (/merge|worktree|branch/i.test(name)) return "⎇";
    if (/build|compile/i.test(name)) return "▣";
    if (/read|grep|rg /i.test(name)) return "◉";
    return "▸";
  }

  function turnsOf(msgs) {
    var out = [], cur = null;
    msgs.forEach(function (m) {
      if (m.role === "compaction") { out.push({ divider: m }); cur = null; return; }
      if (m.role === "user") { out.push({ user: m, agent: [] }); cur = null; return; }
      if (!cur) { cur = { user: null, agent: [] }; out.push(cur); }
      cur.agent.push(m);
    });
    return out;
  }

  function thinkHTML(answers, tools, open, at) {
    var lines = answers.map(function (a) { return a.think; }).filter(Boolean);
    if (!lines.length && tools.length) lines = ["요청을 확인하고 필요한 도구를 실행했습니다."];
    var done = answers.length > 0;
    var sec = (answers[0] && answers[0].thinkFor) || 3;
    var label = done ? "Thought for " + sec + "s" : "Thinking...";
    var body = lines.map(function (x) { return '<p class="think-line">' + esc(x) + "</p>"; }).join("");
    body += tools.map(function (m) {
      var p = toolParts(m.text);
      return '<div class="tool-row"><span class="ico">' + toolIcon(p.name) + '</span><span class="name" title="' + esc(p.name) + '">' + esc(p.name) + "</span>"
        + '<span class="tool-at">' + esc(m.at) + "</span>"
        + (p.out ? '<span class="out">' + esc(p.out) + "</span>" : "") + "</div>";
    }).join("");
    return '<details class="think"' + (open ? " open" : "") + '><summary><span class="brain">✳</span><span class="think-label">' + label + "</span>"
      + (tools.length ? '<span class="think-count">도구 ' + tools.length + "개</span>" : "")
      + (at ? '<span class="think-at">' + esc(at) + "</span>" : "")
      + '<span class="chev">›</span></summary><div class="think-body">' + body + "</div></details>";
  }

  function turnHTML(t, latest, sess) {
    if (t.divider) return '<div class="divider">' + esc(t.divider.text) + " · " + esc(t.divider.at) + "</div>";
    var out = "";
    if (t.user) {
      out += '<div class="msg user"><div class="head"><span>' + esc(t.user.at) + '</span></div>'
        + '<div class="bubble">' + esc(t.user.text) + "</div></div>";
    }
    if (t.agent.length) {
      var tools = t.agent.filter(function (m) { return m.role === "tool"; });
      var answers = t.agent.filter(function (m) { return m.role === "assistant"; });
      var stamp = (t.agent[0] && t.agent[0].at) || "";
      out += '<div class="msg agent">';
      if (tools.length || answers.some(function (a) { return a.think; })) out += thinkHTML(answers, tools, latest, stamp);
      answers.forEach(function (a) { out += '<div class="answer">' + esc(a.text) + "</div>" + '<div class="answer-at">' + esc(a.at) + "</div>"; });
      out += "</div>";
    }
    return out;
  }

  function markNew() {
    var list = $("chat-log").querySelectorAll(".msg");
    if (list.length) list[list.length - 1].classList.add("is-new");
  }

  function sendPrompt(text, after) {
    var s = byId(M.sessions, state.chat);
    if (!s || s.removed) return;
    if (!M.messages[s.id]) M.messages[s.id] = [];
    M.messages[s.id].push({ role: "user", at: now(), text: text });
    renderChat();
    markNew();
    if (after) after();
    var typing = document.createElement("div");
    typing.className = "msg agent typing";
    setHTML(typing, '<details class="think" open><summary><span class="brain">✳</span><span class="think-label">Thinking...</span><span class="think-at">' + esc(now()) + '</span><span class="chev">›</span></summary><div class="think-body"><div class="dots"><i></i><i></i><i></i></div></div></details>');
    $("chat-log").appendChild(typing);
    $("chat-log").scrollTop = $("chat-log").scrollHeight;
    var st = $("chat-status");
    st.textContent = "전송 중…";
    st.className = "status";
    setTimeout(function () {
      if (state.chat !== s.id) return;
      st.textContent = "전달됨 · 터미널 입력 대기";
      st.className = "status ok";
      M.messages[s.id].push({ role: "assistant", at: now(), thinkFor: 3, think: "요청을 읽고 목업 응답을 만들었습니다.", text: "목업 응답입니다. 실제 앱에서는 PTY로 전달되고 세션 파일에 user 레코드가 추가됩니다." });
      if (state.chat === s.id) { renderChat(); markNew(); }
    if (after) after();
    }, 1000);
  }

  /* ---------- orchestration ---------- */
  function renderOrch() {
    var runs = M.runs.filter(function (r) { return r.group === state.group; });
    if (!runs.some(function (r) { return r.id === state.run; })) state.run = runs.length ? runs[0].id : null;
    setHTML($("run-select"), runs.length ? runs.map(function (r) {
      return '<option value="' + r.id + '"' + (r.id === state.run ? " selected" : "") + ">"
        + esc(r.id) + " — " + esc(r.goal) + "</option>";
    }).join("") : '<option value="">이 그룹에 실행 없음</option>');
    $("run-select").onchange = function (e) { state.run = e.target.value || null; renderOrch(); };

    var run = byId(M.runs, state.run);
    $("run-meta").textContent = run ? "status " + run.status + " · started " + run.started + " · tasks " + run.tasks : "이 그룹에 실행 없음";

    var tasks = run ? M.tasks.filter(function (t) { return t.run === state.run; }) : [];
    var doneN = tasks.filter(function (t) { return t.state === "done"; }).length;
    var pct = tasks.length ? Math.round((doneN / tasks.length) * 100) : 0;
    setHTML($("task-list"), tasks.length
      ? '<div class="progress-row"><span>완료 ' + doneN + "/" + tasks.length + '</span><div class="track"><i style="width:' + pct + '%"></i></div></div>'
        + tasks.map(function (t) {
        return '<div class="task ' + t.state + '"><span class="pill ' + (t.state === "running" ? "running" : t.state === "done" ? "done" : t.state === "blocked" ? "idle" : "") + '"><span class="d"></span>'
          + esc(t.state) + '</span><div class="t-main"><div class="t-title">' + esc(t.id) + " · " + esc(t.title) + "</div>"
          + '<div class="deps">' + (t.deps.length ? "deps " + esc(t.deps.join(", ")) : "deps 없음") + "</div></div></div>";
      }).join("")
      : '<p class="empty">' + (run ? "Task 없음" : "이 그룹에 실행 없음") + '</p>');

    var workers = run ? M.workers.filter(function (w) { return w.run === state.run; }) : [];
    if (!workers.some(function (w) { return w.id === state.worker; })) state.worker = workers.length ? workers[0].id : null;
    setHTML($("worker-list"), workers.map(function (w) {
      return '<div class="worker ' + (w.id === state.worker ? "is-active" : "") + '" data-worker="' + w.id + '">'
        + "<span>" + esc(w.id) + " · " + esc(w.task) + "</span>"
        + '<span class="w-meta">' + (w.attention ? '<span class="pill attention">주의</span>' : "")
        + '<span class="pill">' + esc(w.terminalState) + "</span>" + pill(w.state === "done" ? "done" : w.state === "waiting" ? "idle" : "running")
        + "</span></div>";
    }).join("") || '<p class="empty">' + (run ? "Worker 없음" : "이 그룹에 실행 없음") + '</p>');
    [].forEach.call($("worker-list").querySelectorAll("[data-worker]"), function (b) {
      b.onclick = function () { state.worker = b.getAttribute("data-worker"); renderOrch(); };
    });

    $("worker-out").textContent = state.worker ? (M.workerOutput[state.worker] || "(출력 없음)") : "(출력 없음)";
    setHTML($("gate-list"), run ? (M.gates.filter(function (g) { return g.run === state.run; }).map(function (g) {
      return '<div class="gate">'
        + (g.state === "passed" ? '<svg class="chk" viewBox="0 0 16 16"><path d="M3 8.5 6.5 12 13 4.5"/></svg>' : "")
        + '<span>' + esc(g.name) + '</span><span class="pill ' + (g.state === "passed" ? "done" : "idle") + '"><span class="d"></span>' + esc(g.state) + "</span></div>";
    }).join("") || '<p class="empty">Gate 없음</p>') : '<p class="empty">이 그룹에 실행 없음</p>');
    $("n-orch").textContent = tasks.filter(function (t) { return t.state !== "done"; }).length;
  }

  /* ---------- history ---------- */
  function renderHistory() {
    var base = state.results || M.sessions.slice();
    var list = base.filter(function (s) { return (s.group || "") === state.group; });
    list = list.slice().sort(function (a, b) { return a.last < b.last ? 1 : -1; });
    var ROLE = { user: "사용자", assistant: "에이전트", tool: "도구", compaction: "압축" };
    setHTML($("history-list"), list.map(function (s) {
      var hit = "";
      if (state.query) {
        var hay = (M.messages[s.id] || []).map(function (m) { return m.text; }).join(" ");
        var i = hay.toLowerCase().indexOf(state.query.toLowerCase());
        if (i >= 0) hit = '<div class="h-meta">…' + esc(hay.slice(Math.max(0, i - 30), i))
          + '<span class="hit">' + esc(hay.slice(i, i + state.query.length)) + "</span>"
          + esc(hay.slice(i + state.query.length, i + state.query.length + 40)) + "…</div>";
      }
      var openH = !!state.histOpen[s.id];
      var evs = (M.messages[s.id] || []).map(function (m) {
        return '<div class="h-ev"><span class="h-at">' + esc(m.at) + '</span>'
          + '<span class="h-kind ' + esc(m.role) + '">' + esc(ROLE[m.role] || m.role) + '</span>'
          + '<span class="h-text">' + esc(m.text) + "</span></div>";
      }).join("") || '<p class="empty">메시지 없음</p>';
      return '<div class="h-item' + (openH ? " is-open" : "") + '">'
        + '<div class="h-row" data-open="' + s.id + '"><div><div class="h-title">' + esc(s.title) + "</div>"
        + '<div class="h-meta">' + esc(s.wtName || (byId(M.worktrees, s.wt) || {}).name || s.wt) + " · " + esc(short(s.model)) + " · " + esc(s.started) + "–" + esc(s.last) + (s.removed ? ' · <span class="hit">삭제됨</span>' : "") + "</div>"
        + hit + '</div><div class="h-side"><span class="h-tok">' + s.tokens.toLocaleString() + " tok</span>"
        + '<button type="button" class="h-toggle" data-hist="' + s.id + '" aria-expanded="' + (openH ? "true" : "false") + '" aria-label="히스토리 ' + (openH ? "접기" : "펼치기") + '">' + (openH ? "▾" : "▸") + "</button></div></div>"
        + '<div class="h-detail' + (openH ? "" : " hidden") + '" id="hist-' + s.id + '">' + evs + "</div></div>";
    }).join("") || '<p class="empty">조건에 맞는 세션이 없습니다.</p>');
    [].forEach.call($("history-list").querySelectorAll("[data-open]"), function (b) {
      b.onclick = function () { var s = byId(M.sessions, b.getAttribute("data-open")); if (!s) return; state.group = s.group || state.group; state.selected = { type: "session", id: s.id }; state.chat = s.id; setView("chat"); };
    });
    [].forEach.call($("history-list").querySelectorAll("[data-hist]"), function (b) {
      b.onclick = function (e) { e.stopPropagation(); var sid = b.getAttribute("data-hist"); state.histOpen[sid] = !state.histOpen[sid]; renderHistory(); };
    });
    $("n-history").textContent = list.length;
  }

  function runSearch() {
    var q = $("search").value.trim();
    if (!q) { state.query = ""; state.results = null; return renderHistory(); }
    var apply = function () {
      state.query = q;
      state.results = M.sessions.filter(function (s) {
        if ((s.group || "") !== state.group) return false;
        if (s.title.toLowerCase().indexOf(q.toLowerCase()) >= 0) return true;
        return (M.messages[s.id] || []).some(function (m) { return m.text.toLowerCase().indexOf(q.toLowerCase()) >= 0; });
      });
      renderHistory();
    };
    if (state.indexed) return apply();
    setHTML($("history-list"), '<div class="h-row skel"></div><div class="h-row skel"></div><div class="h-row skel"></div><div class="h-row skel"></div>');
    var bar = $("index-bar"), fill = $("index-fill"), label = $("index-label"), p = 0;
    bar.classList.remove("hidden");
    var timer = setInterval(function () {
      p = Math.min(100, p + 7 + Math.random() * 9);
      fill.style.width = p + "%";
      label.textContent = "세션 검색 준비 중 " + Math.round(p) + "%";
      if (p >= 100) {
        clearInterval(timer);
        state.indexed = true;
        label.textContent = "색인 완료 · 2,272 세션 (목업)";
        setTimeout(function () { bar.classList.add("hidden"); }, 900);
        apply();
      }
    }, 90);
  }

  /* ---------- dialogs ---------- */
  function openDialog(opts) {
    $("dlg-title").textContent = opts.title;
    $("dialog").querySelector(".dialog").className = "dialog" + (opts.size ? " " + opts.size : "");
    setHTML($("dlg-body"), opts.body);
    var ok = $("dlg-ok");
    ok.textContent = opts.okLabel || "확인";
    ok.className = "btn " + (opts.danger ? "danger" : "primary");
    [].forEach.call($("dlg-ok").parentNode.querySelectorAll(".dlg-extra"), function (x) { x.remove(); });
    $("dialog").classList.remove("hidden");
    $("dlg-cancel").onclick = closeDialog;
    ok.onclick = function () {
      var keep = opts.onOk && opts.onOk() === false;
      if (!keep) closeDialog();
    };
    if (opts.onOpen) opts.onOpen();
  }
  function closeDialog() { $("dialog").classList.add("hidden"); }

  function deleteDialog(wtId) {
    var wt = byId(M.worktrees, wtId);
    openDialog({
      title: "워크트리 삭제",
      okLabel: "삭제",
      danger: true,
      body: "<p><b>" + esc(wt.name) + "</b> 를 삭제합니다. 이 동작은 되돌릴 수 없습니다.</p>"
        + (wt.dirty ? '<div class="warn">수정 ' + wt.dirty + "개가 남아 있습니다. 삭제할까요?</div>" : "")
        + '<p class="muted">삭제 후 Orca 목록에서 사라집니다. 세션 파일은 건드리지 않습니다.</p>',
      onOk: function () {
        if (!state.orca) { toast("Orca 연결이 없어 삭제할 수 없습니다"); return false; }
        M.worktrees = M.worktrees.filter(function (w) { return w.id !== wtId; });
        M.sessions = M.sessions.filter(function (s) { return s.wt !== wtId; });
        if (!byId(M.sessions, state.chat)) state.chat = M.sessions.length ? M.sessions[0].id : null;
        state.selected = { type: "session", id: state.chat };
        renderBoard();
        toast("삭제 완료 — " + wt.name);
      }
    });
  }

  function renameDialog(wtId) {
    var wt = byId(M.worktrees, wtId);
    openDialog({
      title: "워크트리 이름 수정",
      okLabel: "저장",
      body: '<label>표시 이름<input id="dlg-name" value="' + esc(wt.name) + '"></label>'
        + '<label>메모<input id="dlg-note" placeholder="선택 사항"></label>',
      onOk: function () {
        var v = $("dlg-name").value.trim();
        if (!v) { toast("이름은 비울 수 없습니다"); return false; }
        wt.name = v;
        renderBoard();
        toast("이름 저장 — " + v);
      }
    });
  }

  function _oldWorktreeDialog() {
    openDialog({
      title: "워크트리 생성",
      okLabel: "생성",
      body: '<label>이름<input id="dlg-wt" placeholder="예: ade-chat"></label>'
        + '<label>기본 브랜치<input id="dlg-base" value="main"></label>'
        + "<label>상위 워크트리<select id=\"dlg-parent\"><option value=\"\">없음 (최상위)</option>"

    var wts = groupWtsOf(state.group);

  /* ---------- group / worktree dialogs ---------- */
  var PRESET_INFO = {
    feature: { name: 'Feature', desc: '관리 부모 + 기능 자식' },
    loop: { name: 'Loop', desc: '감시 부모 + 반복 자식' },
    manual: { name: 'Manual', desc: '부모를 직접 구성' }
  };

  function groupWtsOf(gid) {
    return M.worktrees.filter(function (w) { return w.group === gid; });
  }

  function hubWtOf(gid) {
    return M.worktrees.filter(function (w) { return w.group === gid && w.hub; })[0] || null;
  }

  function dfield(label, control) { return '<label class="field"><span class="lbl">' + label + '</span>' + control + '</label>'; }
  function dopts(list, selected) { return list.map(function (v) { return '<option' + (v === selected ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join(''); }

  function groupCreateDialog() {
    var preset = 'feature';

    function repoValue() {
      return draft.repoTouched ? draft.parentRepo : M.workspacesRoot + '\\' + M.slug(draft.name);
    }

    function previewHTML() {
      return '<dl class="kv">'
        + '<dt>프리셋</dt><dd>' + esc(PRESET_INFO[preset].name) + '</dd>'
        + '<dt>이름</dt><dd id="dlg-preview-name">' + (draft.name.trim() ? esc(draft.name.trim()) : '<span class="muted">아직 없음</span>') + '</dd>'
        + '<dt>시작 상태</dt><dd>부모 워크트리 + 세션</dd>'
        + '<dt>워크트리</dt><dd>1개</dd>'
        + '</dl>';
    }

    function body() {
      var presets = Object.keys(PRESET_INFO).map(function (k) {
        return '<button type="button" class="preset' + (k === preset ? ' is-active' : '') + '" data-preset="' + k + '">'
          + '<span class="p-name">' + PRESET_INFO[k].name + '</span>'

          + '<span class="p-tag">' + (k === preset ? '선택됨' : '선택') + '</span></button>';
      }).join('');
      var notice = preset === 'feature'
        ? '부모 워크트리와 세션을 함께 시작합니다. 자식 워크트리는 보드에서 추가합니다.'
        : '부모 워크트리(허브)와 세션을 함께 시작합니다. 워크트리는 보드에서 추가합니다.';

    var sess = activeSessions().filter(function (s) { return s.group === gid || wtIds[s.wt]; });
    var running = sess.filter(function (s) { return s.state === 'running'; }).length;
    var dirty = wts.filter(function (w) { return w.dirty; }).length;
    var rows = wts.map(function (w) {
      return '<div class="del-item"><span class="d' + (w.dirty ? ' dirty' : '') + '"></span><b>' + esc(w.name) + '</b>'

        + (w.dirty ? '<span class="pill dirty"><span class="d"></span>미커밋</span>' : '')

        + '<span class="pill dirty"><span class="d"></span>미커밋 변경 ' + dirty + '개</span>'
        + '<span class="pill"><span class="d"></span>세션 ' + sess.length + '개</span></div>'
        + (running ? '<div class="warn">실행 중인 세션이 ' + running + '개 있습니다. 먼저 중단하지 않으면 응답이 끊길 수 있습니다.</div>' : '')
        + (dirty ? '<div class="warn">미커밋 변경이 있는 워크트리 ' + dirty + '개. 삭제하면 변경 내용이 사라집니다.</div>' : ''),
      onOk: function () {

        M.worktrees = M.worktrees.filter(function (w) { return !wtIds[w.id]; });

  function worktreeDialog() {
    if (!state.group) { toast('그룹을 먼저 선택하세요'); return; }
    var tab = 'new', filter = state.repo;
    var g = byId(M.groups, state.group);
    function importList() {
      var opts = filter ? M.orcaOnly.filter(function (o) { return o.repo === filter; }) : M.orcaOnly;
      if (!opts.length) return '<p class="empty">불러올 워크트리가 없습니다.</p>';
      return opts.map(function (o) {
        var blocked = !!o.blockedBy;
        var reason = blocked ? esc(o.note || ('다른 그룹(' + o.blockedBy + ')에 이미 있음')) : '';
        return '<div class="imp-row' + (blocked ? ' is-blocked' : '') + '">'
          + '<div class="imp-main"><div class="imp-name">' + esc(o.name) + '</div>'
          + '<div class="imp-meta">' + esc(o.repo) + ' · <span class="mono">' + esc(o.branch) + '</span> · ' + esc(o.recent)
          + (reason ? ' · ' + reason : '') + '</div></div>'
          + (blocked ? '<button type="button" class="btn" disabled title="' + esc(o.blockedBy) + ' 그룹 소속">불가</button>'
            : '<button type="button" class="btn" data-import-btn="' + esc(o.id) + '">불러오기</button>')
          + '</div>';
      }).join('');
    }
    function body() {
      var hub = hubWtOf(state.group);
      var head = (g ? '<p class="muted">' + esc(g.name) + ' 그룹에 추가합니다.</p>' : '');
      var tabs = '<div class="tabs">'
        + '<button type="button" class="tab' + (tab === 'new' ? ' is-active' : '') + '" data-tab="new">새 워크트리</button>'
        + '<button type="button" class="tab' + (tab === 'import' ? ' is-active' : '') + '" data-tab="import">기존 불러오기</button></div>';
      if (tab === 'new') {
        return head + tabs + '<div class="form">'
          + '<div class="grid2">'
          + dfield('레포지토리', '<select id="dlg-wtrepo">' + dopts(M.repos, state.repo) + '</select>')
          + dfield('이름', '<input id="dlg-wt" placeholder="예: billing-api">')
          + '</div><div class="grid2">'
          + dfield('브랜치', '<input id="dlg-wtbranch" placeholder="비우면 feature/&lt;이름&gt;">')
          + dfield('베이스 브랜치', '<select id="dlg-wtbase">' + dopts(M.bases || ['main'], '') + '</select>')
          + '</div><div class="grid2">'
          + dfield('모델', '<select id="dlg-wtmodel">' + dopts(M.models, M.models[0]) + '</select>')
          + dfield('부모 워크트리', '<select id="dlg-parent"><option value="">없음 (루트로 추가)</option>'
            + groupWtsOf(state.group).map(function (w) { return '<option value="' + w.id + '"' + (hub && hub.id === w.id ? ' selected' : '') + '>' + esc(w.name) + ' · ' + esc(w.branch) + '</option>'; }).join('') + '</select>')
          + dfield('첫 프롬프트', '<textarea id="dlg-wtprompt" rows="2" placeholder="선택 · 입력하면 세션도 함께 만듭니다"></textarea>')
          + '</div>';
      }
      return head + tabs + '<div class="form">'
        + dfield('레포지토리', '<select id="dlg-wtfilter"><option value="">전체</option>' + dopts(M.repos, filter) + '</select>')
        + '</div>' + '<p class="muted">Orca 워크트리 · 이미 다른 그룹에 있으면 불러올 수 없습니다.</p>' + importList();
    }
    function bind() {
      var ok = $('dlg-ok');
      if (ok) ok.textContent = tab === 'new' ? '추가' : '닫기';
      [].forEach.call($('dlg-body').querySelectorAll('[data-tab]'), function (b) {
        b.onclick = function () { tab = b.getAttribute('data-tab'); setHTML($('dlg-body'), body()); bind(); };
      });
      var repoPick = $('dlg-wtrepo');
      if (repoPick) repoPick.onchange = function () { state.repo = repoPick.value; filter = repoPick.value; };
      var repoFilter = $('dlg-wtfilter');
      if (repoFilter) repoFilter.onchange = function () {
        filter = repoFilter.value;
        if (filter) state.repo = filter;
        setHTML($('dlg-body'), body());
        bind();
      };
      [].forEach.call($('dlg-body').querySelectorAll('[data-import-btn]'), function (b) {
        b.onclick = function () {
          var o = byId(M.orcaOnly, b.getAttribute('data-import-btn'));
          if (!o) return;
          M.worktrees.push({ id: o.id, group: state.group, repo: o.repo, name: o.name, branch: o.branch, parent: null, dirty: false });
          M.orcaOnly = M.orcaOnly.filter(function (x) { return x.id !== o.id; });
          closeDialog();
          renderBoard();
          toast('불러오기 — ' + o.name);
        };
      });
    }
    openDialog({
      title: '워크트리 추가',
      size: 'dialog-wide',
      okLabel: '추가',
      body: body(),
      onOpen: bind,
      onOk: function () {
        if (tab !== 'new') return true;
        var name = $('dlg-wt').value.trim();
        if (!name) { toast('이름을 입력하세요'); return false; }
        if (!M.slug(name)) { toast('폴더로 쓸 수 있는 문자를 포함하세요'); return false; }
        var branch = $('dlg-wtbranch').value.trim() || 'feature/' + name;
        var id = 'wt-' + Date.now().toString(36);
        var parent = $('dlg-parent').value || null;
        var repo = $('dlg-wtrepo').value || state.repo;
        state.repo = repo;

          M.messages[sid] = [{ role: 'user', at: now(), text: prompt }];
          state.chat = sid;
          state.selected = { type: 'session', id: sid };
        }
        renderBoard();
        toast('워크트리 생성 — ' + name);
      }
    });
  }

      okLabel: "저장",
      body: '<div class="form">'
        + dfield('프롬프트', '<textarea id="dlg-lprompt" rows="3" placeholder="매 회차 보낼 프롬프트">' + esc(loop.prompt || "") + '</textarea>')
        + dfield('최대 회차', '<input id="dlg-lmax" type="number" min="1" max="20" value="' + loop.maxRounds + '">')
        + '</div>'
        + '<p class="muted">현재 ' + loop.round + "/" + loop.maxRounds + " 회차 · " + esc(loop.status) + "</p>"
        + (wt.loop ? '<div class="loop-actions"><button type="button" class="btn primary" data-loop-act="start">' + startLabel + '</button>'
          + '<button type="button" class="btn" data-loop-act="pause">일시정지</button>'
          + '<button type="button" class="btn danger" data-loop-act="stop">중단</button></div>' : '')
        + '<p class="muted">응답이 끝나면 다음 회차를 보냅니다. 30분 무응답이면 1회 재시도 후 일시정지합니다.</p>',
      onOpen: function () {
        [].forEach.call($("dlg-body").querySelectorAll("[data-loop-act]"), function (b) {
          b.onclick = function () {
            var act = b.getAttribute("data-loop-act");
            wt.loop.status = act === "start" ? "running" : act === "pause" ? "paused" : "stopped";
            wt.loop.lastEvent = now();
            closeDialog();
            renderBoard();
            toast("Loop " + (act === "start" ? "시작" : act === "pause" ? "일시정지" : "중단") + " — " + wt.name);
          };
        });
      },
      onOk: function () {
        var p = $("dlg-lprompt").value.trim();
        if (!p) { toast("프롬프트를 입력하세요"); return false; }
        var max = Math.max(1, Math.min(20, parseInt($("dlg-lmax").value, 10) || 1));
        wt.loop = { prompt: p, maxRounds: max, round: loop.round, status: loop.status, lastEvent: now() };
        renderBoard();
        toast("Loop 저장 — " + wt.name);
      }
    });
  }

  function hubStart(wid) {
    var wt = byId(M.worktrees, wid);
    var g = wt ? byId(M.groups, wt.group) : null;
    if (!wt || !g) return;
    if (g.hubSessionId) {
      var h = byId(M.sessions, g.hubSessionId);
      if (h && !h.removed) { toast("이미 허브 세션이 있습니다"); return; }
      g.hubSessionId = null;
    }
    var id = "s-" + Date.now().toString(36);
    M.sessions.push({ id: id, title: wt.name + " 허브", wt: wid, group: g.id, model: M.models[0], state: "idle", started: now(), last: now(), tokens: 0, parent: null });
    M.messages[id] = [{ role: "user", at: now(), text: "허브 세션을 시작했습니다. 자식 세션을 조율합니다." }];
    g.hubSessionId = id;
    state.chat = id;
    state.selected = { type: "session", id: id };
    renderBoard();
    toast("허브 세션 시작 — " + wt.name);
  }

  function orcaDialog(wid) {
    var wt = byId(M.worktrees, wid);
    if (!wt) return;
    openDialog({
      title: "Orca 불일치",
      size: "dialog-wide",
      okLabel: "다시 만들기",
      body: '<div class="notice"><span class="pill missing"><span class="d"></span>없음</span><span>Orca에서 <b>' + esc(wt.name) + '</b> 워크트리를 찾을 수 없습니다. 다시 만들면 같은 이름·브랜치로 새 워크트리를 만듭니다. 그룹에서 제거하면 보드 기록만 정리합니다.</span></div>',
      onOk: function () {
        wt.orcaMissing = false;
        renderBoard();
        toast("다시 만들기 — " + wt.name);
      },
      onOpen: function () {
        var b = document.createElement("button");
        b.className = "btn danger dlg-extra";
        b.textContent = "그룹에서 제거";
        b.onclick = function () {
          var name = wt.name;
          M.worktrees = M.worktrees.filter(function (w) { return w.id !== wid; });
          M.sessions.forEach(function (s) { if (s.wt === wid) { s.removed = true; s.state = "idle"; s.wtName = name; } });
          state.chat = (activeSessions()[0] || {}).id || null;
          state.selected = { type: "session", id: state.chat };
          closeDialog();
          renderBoard();
          toast("그룹에서 제거 — " + name);
        };
        var actions = $("dlg-ok").parentNode;
        actions.appendChild(b);
      }
    });
  }

  /* ---------- toast ---------- */
  var toastTimer = null;
  function toast(text) {
    var t = $("toast");
    t.textContent = text;
    t.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.add("hidden"); }, 2400);
  }

  /* ---------- events ---------- */
  $("nav-search").onclick = function () { toast("검색 팔레트는 목업 범위 밖입니다"); };
  [].forEach.call(document.querySelectorAll(".nav-item"), function (b) {
    b.onclick = function () { setView(b.getAttribute("data-view")); };
  });
  $("graph").addEventListener("click", function (e) {
    if (state.dragMoved) { state.dragMoved = false; return; }
    var g = e.target.closest("[data-session]");
    if (g) {
      var id = g.getAttribute("data-session");
      var s = byId(M.sessions, id);
      state.selected = { type: "session", id: id };
      if (s) { state.group = s.group; state.chat = id; }
      return renderBoard();
    }
    var w = e.target.closest(".wt-more");
    if (w) {
      var wid = w.getAttribute("data-wt");
      var wt = byId(M.worktrees, wid);
      state.selected = { type: "wt", id: wid };
      if (wt) {
        state.group = wt.group;
        var root = sessionRoot(wid);
        state.chat = root ? root.id : null;
      }
      return renderBoard();
    }
  });
  $("graph").addEventListener("pointerdown", function (e) {
    if (e.button !== 0) return;
    state.pan = { x: e.clientX, y: e.clientY, vx: state.vx, vy: state.vy, moved: 0 };
    state.dragMoved = false;
    $("graph").classList.add("is-panning");
  });
  $("graph").addEventListener("pointermove", function (e) {
    var p = state.pan;
    if (!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.moved = Math.max(p.moved, Math.abs(dx) + Math.abs(dy));
    if (p.moved < 3) return;
    if (!p.captured && $("graph").setPointerCapture) {
      p.captured = true;
      $("graph").setPointerCapture(e.pointerId);
    }
    var r = $("graph").getBoundingClientRect();
    var k = r.width ? (state.boardW / state.zoom) / r.width : 1;
    state.vx = p.vx - dx * k;
    state.vy = p.vy - dy * k;
    applyView();
  });
  function endPan(e) {
    var p = state.pan;
    if (!p) return;
    state.dragMoved = p.moved >= 3;
    state.pan = null;
    $("graph").classList.remove("is-panning");
    if (p.captured && $("graph").releasePointerCapture && e && e.pointerId != null) {
      try { $("graph").releasePointerCapture(e.pointerId); } catch (err) {}
    }
  }
  $("graph").addEventListener("pointerup", endPan);
  $("graph").addEventListener("pointercancel", endPan);
  $("orca-toggle").onclick = function () { setOrca(!state.orca); };
  $("banner-retry").onclick = function () { setOrca(true); };
  $("composer").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = $("chat-input");
    var text = input.value.trim();
    if (!text || !state.orca) return;
    input.value = "";
    sendPrompt(text);
  });
  $("chat-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      $("composer").dispatchEvent(new Event("submit", { cancelable: true }));
    }
  });
  $("search-btn").onclick = runSearch;
  $("search").addEventListener("keydown", function (e) { if (e.key === "Enter") runSearch(); });
  [].forEach.call(document.querySelectorAll(".tab"), function (b) {
    b.onclick = function () {
      [].forEach.call(document.querySelectorAll(".tab"), function (x) { x.classList.remove("is-active"); });
      b.classList.add("is-active");
      state.range = b.getAttribute("data-range");
      toast(state.range === "30" ? "최근 30일만 표시" : "전체 기간 표시 (목업 데이터는 전부 최근)");
    };
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !$("dialog").classList.contains("hidden")) closeDialog();
    if (state.view !== "board") return;
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key === "+" || e.key === "=") { e.preventDefault(); setZoom(state.zoom * 1.2); }
    else if (e.key === "-" || e.key === "_") { e.preventDefault(); setZoom(state.zoom / 1.2); }
  });

  $("group-new").onclick = groupCreateDialog;
  banner();
  setView("board");
})();
</script>
</body>
</html>
