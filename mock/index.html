<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Graph PI Desktop · 목업</title>
<style>
  @font-face{font-family:'Geist';src:url('./fonts/Geist-Variable.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}

  /* Orca 다크 테마 토큰 — orca-main/src/renderer/src/assets/main.css */
  :root{
    --bg:#0a0a0a; --card:#171717; --panel:#171717; --panel-2:#262626;
    --sidebar:#2a2a2a; --sidebar-accent:#353535;
    --line:rgb(255 255 255 / .07); --input-line:rgb(255 255 255 / .15);
    --text:#f0f0f0; --muted:#acacac; --dim:#737373;
    --accent:#51a2ff; --primary:#e5e5e5; --primary-fg:#171717;
    --green:#10b981; --amber:#d4a300; --red:#ff6568; --purple:#c084fc;
    --radius:10px; --tb:36px; --sb:280px;
    --shadow-sm:0 1px 2px rgb(0 0 0 / .3); --shadow-pop:0 16px 40px rgb(0 0 0 / .55);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:13px/1.5 'Geist',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit}
  .hidden{display:none !important}
  .muted{color:var(--muted)}
  .mono{font-family:'SF Mono',SFMono-Regular,ui-monospace,'Cascadia Code',Menlo,Consolas,monospace}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgb(255 255 255 / .12);border-radius:999px}
  ::-webkit-scrollbar-thumb:hover{background:rgb(255 255 255 / .2)}
  ::-webkit-scrollbar-track{background:transparent}

  .app{display:grid;grid-template-rows:var(--tb) minmax(0,1fr);height:100vh;overflow:hidden}
  .workspace{display:grid;grid-template-columns:var(--sb) minmax(0,1fr);min-height:0;overflow:hidden}

  /* ---------- titlebar (Orca: 36px, card surface, drag region) ---------- */
  .titlebar{
    display:flex;align-items:center;gap:10px;height:var(--tb);min-height:var(--tb);
    padding:0 10px;background:var(--card);border-bottom:1px solid var(--line);
    -webkit-app-region:drag;user-select:none;
  }
  .titlebar button,.titlebar input{-webkit-app-region:no-drag}
  .tb-left{display:flex;align-items:center;gap:8px;min-width:0}
  .mark{width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--purple));flex:0 0 auto}
  .tb-name{font-size:12.5px;font-weight:600;letter-spacing:-.01em}
  .tb-tag{font-size:10px;font-weight:500;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:0 6px;line-height:16px}
  .tb-mid{flex:1;min-width:0}
  .tb-right{display:flex;align-items:center;gap:8px}

  /* ---------- sidebar (Orca worktree sidebar: #2a2a2a) ---------- */
  .sidebar{display:flex;flex-direction:column;gap:6px;min-height:0;padding:8px;background:var(--sidebar);border-right:1px solid var(--line);overflow:hidden}
  .nav-search{
    display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;border-radius:8px;
    background:rgb(255 255 255 / .05);color:rgb(240 240 240 / .6);font-size:13px;font-weight:500;
    text-align:left;cursor:pointer;transition:background .12s ease;
  }
  .nav-search:hover{background:rgb(255 255 255 / .08)}
  .nav-search svg{flex:0 0 auto;color:rgb(240 240 240 / .3)}
  .nav-search .kbd{margin-left:auto;display:flex;gap:4px;font-size:9px;color:rgb(240 240 240 / .45)}
  .nav-search .kbd i{font-style:normal;border:1px solid rgb(255 255 255 / .12);border-radius:4px;padding:0 4px;line-height:14px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-item{
    display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;border-radius:8px;
    background:transparent;color:rgb(240 240 240 / .6);font-size:13px;font-weight:500;letter-spacing:-.01em;
    text-align:left;cursor:pointer;transition:background .12s ease,color .12s ease;
  }
  .nav-item svg{flex:0 0 auto;color:rgb(240 240 240 / .3);transition:color .12s ease}
  .nav-item:hover{background:rgb(255 255 255 / .08);color:var(--text)}
  .nav-item.is-active{background:var(--sidebar-accent);color:var(--text)}
  .nav-item.is-active svg{color:var(--text)}
  .nav-item b{margin-left:auto;font-size:10px;font-weight:500;color:rgb(240 240 240 / .45);font-variant-numeric:tabular-nums}
  .side-sec{display:flex;flex-direction:column;gap:2px;flex:1 1 auto;min-height:0;margin-top:2px;padding-top:6px;border-top:1px solid var(--line);overflow:auto}
  .side-head{display:flex;align-items:center;gap:6px;padding:4px 8px;font-size:11px;font-weight:500;color:rgb(240 240 240 / .45)}
  .side-head span{margin-left:auto;font-variant-numeric:tabular-nums}
  .wt-row{
    display:flex;align-items:center;gap:6px;width:100%;height:28px;padding:0 6px;border:0;border-radius:8px;
    background:transparent;color:var(--muted);font-size:11px;text-align:left;cursor:pointer;
    transition:background .12s ease;
  }
  .wt-row:hover{background:var(--sidebar-accent);color:var(--text)}
  .wt-row .d{flex:0 0 auto;width:6px;height:6px;border-radius:50%;background:var(--dim)}
  .wt-row .d.running{background:var(--amber)} .wt-row .d.done{background:var(--green)}
  .wt-row .d.idle{background:var(--dim)} .wt-row .d.failed{background:var(--red)}
  .wt-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wt-branch{margin-left:auto;font-size:10px;color:rgb(240 240 240 / .35);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:96px}
  .wt-dirty{flex:0 0 auto;font-size:10px;color:var(--amber);font-variant-numeric:tabular-nums}
  .wt-item{display:block}
  .wt-chev{flex:0 0 auto;margin-left:auto;font-size:9px;line-height:1;color:var(--dim)}
  .wt-sess{margin:0 0 4px 13px;border-left:1px solid var(--line)}
  .wt-sess-row{
    display:flex;align-items:center;gap:6px;width:100%;height:24px;padding:0 6px 0 9px;border:0;border-radius:6px;
    background:transparent;color:var(--muted);font-size:10.5px;text-align:left;cursor:pointer;
  }
  .wt-sess-row:hover{background:var(--sidebar-accent);color:var(--text)}
  .wt-sess-row.is-sel{background:var(--sidebar-accent);color:var(--text)}
  .wt-sess-row .d{flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:var(--dim)}
  .wt-sess-row .d.running{background:var(--amber)} .wt-sess-row .d.done{background:var(--green)}
  .wt-sess-row .d.idle{background:var(--dim)} .wt-sess-row .d.failed{background:var(--red)}
  .wt-sess-name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .wt-sess-time{flex:0 0 auto;font-size:9.5px;color:var(--dim);font-variant-numeric:tabular-nums}
  .wt-sess-empty{padding:4px 0 6px 15px;font-size:10px;color:var(--dim)}
  .side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:8px;border-top:1px solid var(--line)}
  .field{display:flex;flex-direction:column;gap:4px;font-size:10px;color:rgb(240 240 240 / .45);padding:0 4px}
  .hint{margin:0;padding:0 4px;font-size:10px;color:rgb(240 240 240 / .35);line-height:1.45}

  /* ---------- controls (Orca button/input) ---------- */
  select,input,textarea{
    font:inherit;color:var(--text);background:rgb(255 255 255 / .05);
    border:1px solid var(--input-line);border-radius:8px;padding:6px 9px;outline:none;width:100%;
    transition:border-color .12s ease,box-shadow .12s ease;
  }
  select:hover,input:hover,textarea:hover{background:rgb(255 255 255 / .07)}
  select:focus,input:focus,textarea:focus{border-color:var(--dim);box-shadow:0 0 0 3px rgb(115 115 115 / .5)}
  .sidebar select{font-size:11px;padding:5px 8px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;height:30px;padding:0 12px;
    border:1px solid var(--input-line);border-radius:8px;background:rgb(255 255 255 / .05);
    color:var(--text);font-size:12.5px;font-weight:500;white-space:nowrap;cursor:pointer;
    transition:background .12s ease,border-color .12s ease;
  }
  .btn:hover{background:rgb(255 255 255 / .09);border-color:rgb(255 255 255 / .25)}
  .btn.primary{background:var(--primary);border-color:transparent;color:var(--primary-fg)}
  .btn.primary:hover{background:#d4d4d4}
  .btn.danger{background:rgb(255 101 104 / .15);border-color:rgb(255 101 104 / .4);color:var(--red)}
  .btn.danger:hover{background:rgb(255 101 104 / .22)}
  .btn.ghost{background:transparent;border-color:transparent}
  .btn.ghost:hover{background:rgb(255 255 255 / .08)}
  .btn[disabled]{opacity:.5;cursor:not-allowed}

  /* ---------- main ---------- */
  .main{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--bg)}
  .banner{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:11.5px;background:rgb(212 163 0 / .12);border-bottom:1px solid rgb(212 163 0 / .3);color:#f0d9a3}
  .banner .dot{width:6px;height:6px;border-radius:50%;background:var(--amber)}
  .banner button{margin-left:auto;height:24px;font-size:11.5px;padding:0 8px}

  .topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:16px 16px 10px}
  .topbar h1{margin:0;font-size:14px;font-weight:600;letter-spacing:-.01em}
  .sub{margin:3px 0 0;font-size:11px;color:var(--dim)}
  .actions{display:flex;gap:6px}

  .views{flex:1;min-height:0;padding:0 16px 16px;overflow:auto}
  .view{height:100%}

  /* ---------- board ---------- */
  .board{display:grid;grid-template-columns:minmax(0,1fr) 318px;gap:10px;align-content:start;min-height:520px}
  .graph-wrap{
    position:relative;border:1px solid var(--line);border-radius:12px;background:var(--card);
    box-shadow:var(--shadow-sm);overflow:auto;display:flex;flex-direction:column;
  }
  .grp{border-bottom:1px solid var(--line)}
  .grp-head{display:flex;align-items:center;gap:6px;width:100%;padding:8px 10px 6px;border:0;background:transparent;color:var(--muted);font-size:10.5px;cursor:pointer;text-align:left}
  .grp-head:hover{color:var(--text)}
  .grp-head .chev{font-size:9px;color:var(--dim);transition:transform .12s ease}
  .grp.is-closed .grp-head .chev{transform:rotate(-90deg)}
  .grp.is-active .grp-head{color:var(--text)}
  .grp-head b{margin-left:auto;font-size:10px;font-weight:500;color:var(--dim)}
  .grp-head em{margin-left:6px;font-style:normal;font-size:9.5px;color:var(--dim);opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grp-more{margin-left:auto;padding:0 3px;font-style:normal;font-size:12px;color:var(--dim);line-height:1}
  .grp-more:hover{color:var(--text)}
  .side-add{margin-left:4px;height:18px;padding:0 5px;border:1px solid var(--input-line);border-radius:6px;background:transparent;color:var(--muted);font-size:11px;line-height:1;cursor:pointer}
  .side-add:hover{background:rgb(255 255 255 / .08);color:var(--text)}
  .grp-body{display:flex;flex-direction:column;gap:1px;padding:0 6px 6px}
  .grp.is-closed .grp-body{display:none}
  #graph{display:block;width:100%;height:auto;max-height:100%;min-height:0;cursor:grab;touch-action:none;user-select:none}
  #graph.is-panning,#graph.is-panning .node{cursor:grabbing}
  #graph .node{cursor:pointer}
  #graph text{font-family:'Geist',-apple-system,'Segoe UI',sans-serif}
  .edge-flow{stroke-dasharray:7 5;animation:edge-dash .9s linear infinite}
  .edge-dash{stroke-dasharray:6 5}
  @keyframes ring-out{0%{r:5;opacity:.85}70%{r:11;opacity:0}100%{r:11;opacity:0}}
  .node-ring{animation:ring-out 2s ease-out infinite}
  @keyframes loop-turn{to{stroke-dashoffset:-22}}
  .loop-ring{animation:loop-turn 1s linear infinite}
  .edge-dot{pointer-events:none}
  @keyframes edge-dash{to{stroke-dashoffset:-12}}
  @media (prefers-reduced-motion: reduce){
    .edge-flow{animation:none;stroke-dasharray:none}
    .edge-dot{display:none}
    .node-ring{display:none}
    .loop-ring{animation:none}
  }
  .node{cursor:pointer}
  .node circle{transition:filter .15s ease}
  .node:hover circle{filter:brightness(1.3)}
  .node.is-sel circle{stroke:#fff;stroke-width:2}

  .inspector{
    border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow-sm);
    padding:14px;overflow:auto;max-height:calc(100vh - 120px);
  }
  .insp-head{display:flex;align-items:flex-start;gap:8px}
  .insp-head h2{margin:0;font-size:13px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
  .pill{
    display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:500;line-height:16px;
    padding:0 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);
    background:rgb(255 255 255 / .04);white-space:nowrap;
  }
  .pill .d{width:6px;height:6px;border-radius:50%;background:var(--dim)}
  .pill.running .d{background:var(--amber)} .pill.running{color:#f0d9a3;border-color:rgb(212 163 0 / .35);background:rgb(212 163 0 / .12)}
  .pill.done .d{background:var(--green)} .pill.done{color:#9fe8c8;border-color:rgb(16 185 129 / .35);background:rgb(16 185 129 / .12)}
  .pill.idle .d{background:var(--dim)} .pill.idle{color:var(--muted)}
  .pill.failed .d{background:var(--red)} .pill.failed{color:#ffb3b4;border-color:rgb(255 101 104 / .35);background:rgb(255 101 104 / .12)}
  .kv{display:grid;grid-template-columns:78px 1fr;gap:6px 10px;margin:14px 0 0;font-size:11.5px}
  .kv dt{color:var(--dim)} .kv dd{margin:0;color:var(--text)}
  .insp-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
  .insp-loop{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
  .insp-loop h3{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:11px;font-weight:600;color:var(--muted)}
  .insp-loop .loop-meta{margin:0 0 8px;font-size:10.5px;color:var(--dim)}
  .insp-loop textarea,.insp-loop input{width:100%;font:inherit;font-size:11.5px;color:var(--text);background:var(--panel-2);border:1px solid var(--input-line);border-radius:8px;padding:6px 8px;resize:vertical}
  .insp-loop .loop-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .insp-loop .loop-row .btn{flex:1 1 auto}
  .insp-chat{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
  .insp-chat h3{display:flex;align-items:center;gap:6px;margin:0 0 8px;font-size:11px;font-weight:600;color:var(--muted)}
  .insp-chat-n{margin-left:auto;font-size:10px;font-weight:400;color:var(--dim)}
  .insp-thread{overflow:auto;display:flex;flex-direction:column;gap:14px;padding-right:4px}
  .insp-thread .msg{font-size:11.5px}
  .insp-resize{height:8px;margin:6px 0;cursor:ns-resize;border-radius:4px;background:linear-gradient(var(--line),var(--line)) center/32px 2px no-repeat}
  .insp-resize:hover{background-color:rgb(255 255 255 / .04)}
  .insp-form{display:flex;gap:6px;align-items:flex-end}
  .insp-form textarea{flex:1;min-width:0;font:inherit;font-size:11.5px;color:var(--text);background:var(--panel-2);border:1px solid var(--input-line);border-radius:8px;padding:6px 8px;resize:vertical}
  .insp-form .btn{flex:0 0 auto}
  .insp-tools{margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
  .insp-tools h3{margin:0 0 6px;font-size:11px;font-weight:600;color:var(--muted)}
  .insp-tools .tool-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:baseline;padding:3px 0;font-size:11px}
  .insp-tools .tool-sess{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
  .insp-tools .tool-name{color:var(--accent)}
  .insp-tools .tool-meta{color:var(--dim);font-size:10px}
  .empty{padding:26px 6px;color:var(--dim);font-size:12px;text-align:center;line-height:1.7}

  /* ---------- chat ---------- */
  .chat{display:grid;grid-template-columns:212px minmax(0,1fr);gap:10px;height:100%;min-height:520px}
  .chat-side{border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow-sm);padding:8px;overflow:auto}
  .side-head{padding:2px 4px 6px;font-size:10px;color:var(--dim)}
  .chat-item{display:flex;gap:8px;width:100%;padding:6px 8px;border:0;border-radius:8px;background:transparent;color:var(--muted);text-align:left;cursor:pointer;font-size:11.5px;line-height:1.4;transition:background .12s ease}
  .chat-item:hover{background:rgb(255 255 255 / .06);color:var(--text)}
  .chat-item.is-active{background:var(--panel-2);color:var(--text)}
  .chat-item .d{flex:0 0 auto;width:6px;height:6px;border-radius:50%;margin-top:5px;background:var(--dim)}
  .chat-item.running .d{background:var(--amber)} .chat-item.done .d{background:var(--green)}
  .chat-item.idle .d{background:var(--dim)} .chat-item.failed .d{background:var(--red)}
  .chat-main{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow-sm);overflow:hidden}
  .chat-head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px}
  .chat-head .who{font-weight:600}
  .chat-head .meta{margin-left:auto;color:var(--dim);font-size:10.5px}
  .chat-log{flex:1;overflow:auto;padding:18px 18px 12px;display:flex;flex-direction:column;gap:18px}
  .msg{max-width:100%;min-width:0}
  .msg.user{align-self:flex-end;max-width:82%;display:flex;flex-direction:column;align-items:flex-end}
  .msg.user .head{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin:0 2px 5px;font-size:10px;color:var(--dim);font-variant-numeric:tabular-nums}
  .msg.user .bubble{background:rgb(81 162 255 / .1);border:1px solid rgb(81 162 255 / .24);border-radius:12px;padding:9px 13px;font-size:12.5px;line-height:1.7;white-space:pre-wrap;color:var(--text)}
  .msg.agent{align-self:stretch;max-width:820px;display:flex;flex-direction:column}
  .think{margin:0 0 8px}
  .think summary{display:flex;align-items:center;gap:6px;list-style:none;cursor:pointer;padding:3px 0 6px;font-size:11px;color:var(--muted);user-select:none}
  .think summary::-webkit-details-marker{display:none}
  .think .brain{color:var(--accent);font-size:11px;line-height:1;opacity:.85}
  .think .think-count{color:var(--dim);font-size:10px}
  .think .think-at{margin-left:auto;color:var(--dim);font-size:10px;font-variant-numeric:tabular-nums}
  .think .chev{margin-left:4px;color:var(--dim);font-size:13px;line-height:1;transition:transform .15s ease}
  .think[open] .chev{transform:rotate(90deg)}
  .think-body{padding:0 0 5px}
  .think-line{margin:0 0 7px;color:var(--muted);font-size:11.5px;line-height:1.65;white-space:pre-wrap}
  .tool-row{display:grid;grid-template-columns:13px minmax(0,1fr) auto;column-gap:7px;row-gap:1px;padding:6px 0;border-top:1px solid rgb(255 255 255 / .05);font-size:11px}
  .tool-row:first-of-type{border-top:0;padding-top:1px}
  .tool-row .ico{color:var(--dim);line-height:1.45;text-align:center}
  .tool-row .name{color:var(--muted);font-family:'SF Mono',SFMono-Regular,ui-monospace,'Cascadia Code',Consolas,monospace;font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tool-at{color:var(--dim);font-size:10px;line-height:1.45;text-align:right;font-variant-numeric:tabular-nums}
  .tool-row .out{grid-column:2 / 4;color:var(--dim);font-size:10.5px;line-height:1.55;white-space:pre-wrap}
  .msg.agent .answer{padding-left:0;font-size:12.5px;line-height:1.75;white-space:pre-wrap;color:var(--text)}
  .msg.agent .answer-at{margin:3px 0 10px;color:var(--dim);font-size:10px;text-align:right;font-variant-numeric:tabular-nums}
  .msg.agent .answer-at:last-child{margin-bottom:0}
  .msg.agent .answer + .think{margin-top:10px}
  .msg.typing{padding-left:0}
  .msg.typing .dots{display:flex;gap:4px;padding:7px 0}
  .msg.typing .dots i{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:dot 1.1s infinite ease-in-out}
  .msg.typing .dots i:nth-child(2){animation-delay:.15s}
  .msg.typing .dots i:nth-child(3){animation-delay:.3s}
  .divider{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:10px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .composer{border-top:1px solid var(--line);padding:10px 12px;background:var(--card)}
  .composer textarea{resize:none;min-height:46px;font-size:12.5px;background:rgb(255 255 255 / .04)}
  .composer-foot{display:flex;align-items:center;gap:8px;margin-top:8px}
  .status{margin-left:auto;font-size:11px;color:var(--dim)}
  .status.ok{color:var(--green)} .status.err{color:var(--red)}

  /* ---------- orchestration ---------- */
  .orch{display:flex;flex-direction:column;gap:10px;height:100%}
  .orch-head{display:flex;align-items:center;gap:8px}
  .orch-head select{width:auto;min-width:280px}
  .readonly{color:#9fe8c8;border-color:rgb(16 185 129 / .35);background:rgb(16 185 129 / .12)}
  .orch-grid{display:grid;grid-template-columns:1.25fr 1fr 1.1fr;gap:10px;flex:1;min-height:0}
  .panel{border:1px solid var(--line);border-radius:12px;background:var(--card);box-shadow:var(--shadow-sm);padding:12px;overflow:auto}
  .panel h3{margin:0 0 8px;font-size:10px;font-weight:600;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
  .panel h3.mt{margin-top:14px}
  .task{display:flex;align-items:flex-start;gap:9px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:rgb(255 255 255 / .03);margin-bottom:6px}
  .task .t-main{min-width:0}
  .task .t-title{font-size:12px}
  .task .deps{margin-top:3px;font-size:10px;color:var(--dim)}
  .task.blocked{opacity:.9;border-color:rgb(212 163 0 / .3)}
  .task.done{opacity:.7}
  .worker{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:rgb(255 255 255 / .03);margin-bottom:6px;cursor:pointer;font-size:11.5px;transition:background .12s ease,border-color .12s ease}
  .worker:hover{background:rgb(255 255 255 / .06)}
  .worker.is-active{border-color:rgb(81 162 255 / .4);background:rgb(81 162 255 / .08)}
  .worker .w-meta{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:10px;color:var(--dim)}
  .attention{color:#ffb3b4;border-color:rgb(255 101 104 / .35);background:rgb(255 101 104 / .12)}
  pre.out{margin:0;padding:10px;border:1px solid var(--line);border-radius:9px;background:#111;color:var(--muted);font:11px/1.6 'SF Mono',SFMono-Regular,ui-monospace,'Cascadia Code',Consolas,monospace;white-space:pre-wrap;min-height:150px}
  .gate{display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;font-size:11.5px;margin-bottom:5px}

  /* ---------- history ---------- */
  .history{display:flex;flex-direction:column;gap:10px;max-width:980px}
  .history-head{display:flex;gap:6px;align-items:center}
  .history-head input{flex:1;height:30px}
  .tabs{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:9px;background:rgb(255 255 255 / .03)}
  .tab{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:4px 10px;font-size:11.5px;cursor:pointer;transition:background .12s ease}
  .tab:hover{background:rgb(255 255 255 / .06);color:var(--text)}
  .tab.is-active{background:var(--panel-2);color:var(--text)}
  .indexbar{display:flex;align-items:center;gap:10px;font-size:11px;color:var(--muted)}
  .indexbar .bar{flex:1;height:4px;border-radius:999px;background:rgb(255 255 255 / .08);overflow:hidden}
  .indexbar .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .18s ease}
  .history-list{display:flex;flex-direction:column;gap:6px}
  .h-item{border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:hidden}
  .h-row{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 12px;cursor:pointer;transition:background .12s ease}
  .h-row:hover{background:#1c1c1c}
  .h-side{display:flex;align-items:center;gap:8px}
  .h-toggle{width:22px;height:22px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);font-size:11px;line-height:1;cursor:pointer;padding:0}
  .h-toggle:hover{border-color:rgb(255 255 255 / .22);color:var(--text)}
  .h-detail{border-top:1px solid var(--line);padding:9px 12px 11px;max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:6px}
  .h-ev{display:grid;grid-template-columns:36px 54px minmax(0,1fr);gap:8px;font-size:11px;line-height:1.55}
  .h-at{color:var(--dim);font-size:10px;font-variant-numeric:tabular-nums}
  .h-kind{color:var(--dim);font-size:10px}
  .h-kind.user{color:var(--accent)}
  .h-kind.assistant{color:var(--green)}
  .h-kind.tool{color:var(--amber)}
  .h-text{color:var(--muted);white-space:pre-wrap;word-break:break-word}
  .h-row .h-title{font-size:12.5px}
  .h-row .h-meta{margin-top:3px;font-size:10.5px;color:var(--dim)}
  .h-row .h-tok{font-size:10.5px;color:var(--dim);white-space:nowrap}
  .hit{background:rgb(212 163 0 / .25);color:#f6e2b4;border-radius:3px;padding:0 2px}

  /* ---------- dialog / toast (Orca floating surface) ---------- */
  .backdrop{position:fixed;inset:0;background:rgb(0 0 0 / .55);display:flex;align-items:center;justify-content:center;z-index:20;backdrop-filter:blur(2px)}
  .dialog{width:min(420px,92vw);border:1px solid rgb(255 255 255 / .1);border-radius:14px;background:rgb(23 23 23 / .97);padding:18px;box-shadow:var(--shadow-pop)}
  .dialog h2{margin:0 0 10px;font-size:14px;font-weight:600}
  .dialog p{margin:0 0 12px;font-size:12px;color:var(--muted);line-height:1.6}
  .dialog .dlg-body{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
  .dialog label{display:flex;flex-direction:column;gap:5px;font-size:10.5px;color:var(--dim)}
  .dialog .warn{padding:8px 10px;border:1px solid rgb(212 163 0 / .3);border-radius:8px;background:rgb(212 163 0 / .12);color:#f0d9a3;font-size:11.5px}
  .dlg-presets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .dlg-preset{display:flex;flex-direction:column;gap:2px;padding:8px;border:1px solid var(--line);border-radius:9px;background:rgb(255 255 255 / .03);cursor:pointer;font-size:11px;text-align:left;color:var(--text)}
  .dlg-preset.is-active{border-color:var(--accent);background:rgb(81 162 255 / .1)}
  .dlg-preset b{font-size:11.5px}.dlg-preset span{font-size:9.5px;color:var(--dim)}
  .dlg-tabs{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:rgb(255 255 255 / .03)}
  .dlg-tab{flex:1;border:0;background:transparent;color:var(--muted);border-radius:6px;padding:5px;font-size:11px;cursor:pointer}
  .dlg-tab.is-active{background:var(--panel-2);color:var(--text)}
  .dlg-list{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto}
  .dlg-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-size:11px}
  .dlg-row .grow{flex:1;min-width:0}.dlg-row .mono{font-size:9.5px;color:var(--dim)}
  .dlg-row .btn{height:24px;padding:0 8px;font-size:11px}
  .dlg-row.is-off{opacity:.45}
  .dlg-actions{display:flex;justify-content:flex-end;gap:6px}
  #dialog .dialog-wide{width:min(560px,94vw);max-height:82vh;overflow:auto}
  #dialog .dialog-xl{width:min(980px,96vw);max-height:90vh;overflow:auto}
  #dialog .wizard{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
  #dialog .wizard .card{border:0;background:transparent;padding:0}
  #dialog .card-h{margin:0 0 8px;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  #dialog .card-h.mt{margin-top:16px}
  #dialog .preset-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  #dialog .preset{display:flex;flex-direction:column;gap:3px;padding:10px;border:1px solid var(--line);border-radius:10px;background:rgb(255 255 255 / .03);color:var(--text);text-align:left;cursor:pointer}
  #dialog .preset:hover{border-color:var(--input-line)}
  #dialog .preset.is-active{border-color:var(--accent);background:rgb(81 162 255 / .1)}
  #dialog .preset .p-name{font-size:13px;font-weight:600}
  #dialog .preset .p-desc{font-size:11px;color:var(--muted);line-height:1.5}
  #dialog .preset .p-tag{font-size:9.5px;color:var(--dim)}
  #dialog .preset.is-active .p-tag{color:var(--accent)}
  #dialog .form{display:flex;flex-direction:column;gap:10px}
  #dialog .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #dialog .field{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:5px;font-size:10.5px;color:var(--dim);min-width:0;padding:0}
  #dialog .field .lbl{font-size:10.5px;color:var(--dim)}
  #dialog .field.err input{border-color:var(--red)}
  #dialog .field .err-txt{font-size:10px;color:var(--red)}
  #dialog .notice{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:rgb(255 255 255 / .03);font-size:11px;color:var(--muted);line-height:1.55}
  #dialog .side-actions{display:flex;flex-direction:column;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  #dialog .hintx{font-size:10.5px;color:var(--dim);line-height:1.55;margin:8px 0 0}
  #dialog .kv{margin:0}
  #dialog .del-list{display:flex;flex-direction:column;gap:5px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:rgb(255 255 255 / .03)}
  #dialog .del-item{display:flex;align-items:center;gap:6px;font-size:11.5px;flex-wrap:wrap}
  #dialog .del-item b{font-weight:600}
  #dialog .del-item .d{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:0 0 auto}
  #dialog .del-item .d.dirty{background:var(--amber)}
  #dialog .pill.dirty .d{background:var(--amber)}
  #dialog .pill.missing .d{background:var(--red)}
  #dialog .stats{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  #dialog .imp-row{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:rgb(255 255 255 / .03);font-size:11.5px;margin-bottom:6px}
  #dialog .imp-row.is-blocked{opacity:.55}
  #dialog .imp-main{min-width:0;flex:1}
  #dialog .imp-name{font-size:12px}
  #dialog .imp-meta{margin-top:2px;font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #dialog .tabs{display:flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:9px;background:rgb(255 255 255 / .03);width:max-content;max-width:100%;margin-bottom:10px}
  #dialog .tab{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:4px 10px;font-size:11.5px;cursor:pointer;white-space:nowrap}
  #dialog .tab:hover{background:rgb(255 255 255 / .06);color:var(--text)}
  #dialog .tab.is-active{background:var(--panel-2);color:var(--text)}
  #dialog .loop-actions{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  #dialog .loop-actions .btn{height:27px;font-size:11.5px;padding:0 9px}
  @media(max-width:760px){#dialog .wizard{grid-template-columns:1fr}#dialog .grid2{grid-template-columns:1fr}}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:8px 14px;border:1px solid rgb(255 255 255 / .1);border-radius:999px;background:rgb(23 23 23 / .97);box-shadow:var(--shadow-pop);font-size:12px;z-index:30}

  /* ---------- motion (선택된 시안) ---------- */
  @keyframes row-in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  @keyframes bar-sweep{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @keyframes grp-flash{0%{color:#51a2ff}100%{color:var(--text)}}
  @keyframes card-sel{0%,100%{stroke:#51a2ff5c}50%{stroke:#51a2ffcc}}
  @keyframes dirty-blink{0%,100%{opacity:.45}50%{opacity:1}}
  @keyframes field-in{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
  @keyframes msg-flash{0%{background:rgb(81 162 255 / .2)}100%{background:rgb(255 255 255 / .06)}}
  @keyframes typing{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}
  @keyframes bar-in{from{width:0}}
  @keyframes soft-pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes chk-draw{from{stroke-dashoffset:16}}
  @keyframes shimmer{from{background-position:-130px 0}to{background-position:130px 0}}
  @keyframes view-in{from{opacity:0;transform:translateY(4px)}}
  @keyframes toast-in{from{opacity:0;transform:translate(-50%,10px) scale(.98)}to{opacity:1;transform:translateX(-50%)}}
  @keyframes fade-in{from{opacity:0}}
  @keyframes dialog-in{from{opacity:0;transform:scale(.96) translateY(4px)}to{opacity:1;transform:none}}

  /* 사이드바: 그룹 펼침 / 선택 강조선 / 새 그룹 플래시 */
  .wt-row{position:relative;overflow:hidden}
  .grp.is-open-anim .wt-row{animation:row-in .26s ease-out both}
  .grp.is-open-anim .wt-item:nth-child(2) .wt-row{animation-delay:.04s}
  .grp.is-open-anim .wt-item:nth-child(3) .wt-row{animation-delay:.08s}
  .grp.is-open-anim .wt-item:nth-child(4) .wt-row{animation-delay:.12s}
  .wt-row.is-sel::before{content:"";position:absolute;left:0;top:5px;bottom:5px;width:2px;border-radius:2px;background:var(--accent);transform-origin:top;animation:bar-sweep .4s ease-out both}
  .grp.is-flash .grp-head > span:nth-child(2){animation:grp-flash .7s ease-out both}

  /* 워크트리 카드: 선택 맥동 / 호버 리프트 / dirty 점멸 */
  .wt-card{transition:transform .18s ease,stroke .18s ease}
  .wt-col:hover .wt-card{transform:translateY(-2px);stroke:#ffffff2e}
  .wt-card.is-sel{animation:card-sel 2s ease-in-out infinite}
  .dirty-dot{animation:dirty-blink 1.8s ease-in-out infinite}

  /* 인스펙터: 필드 순차 등장 */
  .kv > *{animation:field-in .26s ease-out both}
  .kv > *:nth-child(1){animation-delay:0s}.kv > *:nth-child(2){animation-delay:.03s}
  .kv > *:nth-child(3){animation-delay:.06s}.kv > *:nth-child(4){animation-delay:.09s}
  .kv > *:nth-child(5){animation-delay:.12s}.kv > *:nth-child(6){animation-delay:.15s}
  .kv > *:nth-child(7){animation-delay:.18s}.kv > *:nth-child(8){animation-delay:.21s}
  .kv > *:nth-child(9){animation-delay:.24s}.kv > *:nth-child(10){animation-delay:.27s}
  .kv > *:nth-child(11){animation-delay:.3s}.kv > *:nth-child(12){animation-delay:.33s}

  /* 채팅: 새 메시지 플래시 / 타이핑 점 */
  .msg.typing .body{display:flex;gap:4px;align-items:center}
  .msg.typing .body i{width:4px;height:4px;border-radius:50%;background:var(--muted);animation:typing 1.1s ease-in-out infinite}
  .msg.typing .body i:nth-child(2){animation-delay:.15s}
  .msg.typing .body i:nth-child(3){animation-delay:.3s}
  .msg.is-new .body{animation:msg-flash .9s ease-out both}

  /* 오케스트레이션: 진행률 / 워커 상태 점 / 게이트 체크 */
  .progress-row{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--dim);margin-bottom:8px}
  .progress-row .track{flex:1;height:4px;border-radius:999px;background:rgb(255 255 255 / .08);overflow:hidden}
  .progress-row .track i{display:block;height:100%;background:var(--accent);border-radius:999px;animation:bar-in .7s ease-out both}
  .worker .pill.running .d{animation:soft-pulse 1.4s ease-in-out infinite}
  .gate .chk{width:13px;height:13px;flex:0 0 auto;stroke:var(--green);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:16;animation:chk-draw .6s ease-out both}

  /* 히스토리: 결과 순차 등장 / 스케줄레톤 */
  .h-row{animation:row-in .26s ease-out both}
  .history-list .h-row:nth-child(2){animation-delay:.04s}
  .history-list .h-row:nth-child(3){animation-delay:.08s}
  .history-list .h-row:nth-child(4){animation-delay:.12s}
  .history-list .h-row:nth-child(5){animation-delay:.16s}
  .history-list .h-row:nth-child(6){animation-delay:.2s}
  .h-row.skel{height:52px;border-style:dashed;background:linear-gradient(90deg,#ffffff08 0%,#ffffff18 45%,#ffffff08 85%);background-size:260px 100%;animation:shimmer 1.2s linear infinite}

  /* 화면 전환 · 토스트 · 다이얼로그 */
  .view:not(.hidden){animation:view-in .22s ease-out both}
  .toast{animation:toast-in .28s ease-out both}
  .backdrop{animation:fade-in .18s ease-out both}
  .dialog{animation:dialog-in .2s ease-out both}

  @media (prefers-reduced-motion: reduce){
    .grp .wt-row,.wt-row.is-sel::before,.grp-head.is-flash > span,.wt-card.is-sel,.dirty-dot,.kv > *,
    .msg.is-new .body,.msg.typing .body i,.progress-row .track i,.worker .pill .d,.gate .chk,
    .h-row,.view,.toast,.backdrop,.dialog{animation:none !important}
    .wt-col:hover .wt-card{transform:none}
    .h-row.skel{background:#ffffff0d}
  }
</style>
</head>
<body>
<div class="app">
  <header class="titlebar">
    <div class="tb-left"><span class="mark"></span><span class="tb-name">Graph PI</span><span class="tb-tag">MOCKUP</span></div>
    <div class="tb-mid"></div>
    <div class="tb-right"><span class="pill" id="tb-status"><span class="d"></span><span id="tb-status-text">Orca 연결됨</span></span></div>
  </header>
  <div class="workspace">
  <aside class="sidebar">
    <button class="nav-search" type="button" id="nav-search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>검색<span class="kbd"><i>Ctrl</i><i>K</i></span></button>
    <nav class="nav" id="nav">
      <button class="nav-item is-active" data-view="board"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>상태 보드<b id="n-board">9</b></button>
      <button class="nav-item" data-view="chat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M21 12a8 8 0 0 1-8 8H8l-5 3 1.6-5A8 8 0 1 1 21 12z"></path></svg>채팅<b id="n-chat">3</b></button>
      <button class="nav-item" data-view="orch"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="6" cy="6" r="2.5"></circle><circle cx="6" cy="18" r="2.5"></circle><circle cx="18" cy="12" r="2.5"></circle><path d="M8.5 6H13a2.5 2.5 0 0 1 2.5 2.5v1M8.5 18H13a2.5 2.5 0 0 0 2.5-2.5v-1"></path></svg>오케스트레이션<b id="n-orch">4</b></button>
      <button class="nav-item" data-view="history"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>히스토리<b id="n-history">9</b></button>
    </nav>
    <div class="side-sec">
      <div class="side-head">워크스페이스<span id="wt-count">3</span><button class="side-add" id="group-new" type="button" title="새 그룹">+</button></div>
      <div id="wt-list"></div>
    </div>
    <div class="side-foot">
      <label class="field">워크스페이스<select><option>graph-pi-ade</option><option>C:/Projects/orca-main</option></select></label>
      <button class="btn ghost" id="orca-toggle">Orca 연결 끊기</button>
      <p class="hint">더미 데이터 · Orca CLI 미연결<br>실제 파일은 읽지 않습니다.</p>
    </div>
  </aside>

  <main class="main">
    <div class="banner hidden" id="banner"><span class="dot"></span><span>Orca 연결 없음 — 지난 세션만 표시합니다</span><button class="btn ghost" id="banner-retry">다시 연결</button></div>
    <header class="topbar">

              <div class="composer-foot"><span class="status" id="chat-status"></span><button class="btn primary" type="submit" id="chat-send">전송</button></div>
            </form>

      <section class="view hidden" id="view-orch">

            <select id="run-select"></select>
            <span class="pill readonly">조회 전용 · 변경 없음</span>
            <span class="muted" id="run-meta"></span>
          </div>
          <div class="orch-grid">
            <div class="panel"><h3>Task</h3><div id="task-list"></div></div>
            <div class="panel"><h3>Worker</h3><div id="worker-list"></div></div>
            <div class="panel"><h3>Worker 출력</h3><pre class="out" id="worker-out"></pre><h3 class="mt">Gate</h3><div id="gate-list"></div></div>

        <div class="history">

            <input id="search" type="search" placeholder="현재 그룹 세션 본문 검색 — 30일 이전 포함" />
            <button class="btn primary" id="search-btn">검색</button>
            <div class="tabs"><button class="tab is-active" data-range="30">최근 30일</button><button class="tab" data-range="all">전체</button></div>
          </div>
          <div class="indexbar hidden" id="index-bar"><div class="bar"><i id="index-fill"></i></div><span id="index-label">세션 검색 준비 중 0%</span></div>
          <div class="history-list" id="history-list"></div>

  </main>
  </div>
</div>

<div class="backdrop hidden" id="dialog">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title">
    <h2 id="dlg-title"></h2>
