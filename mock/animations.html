<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ADE 애니메이션 시안</title>
<style>
  @font-face{font-family:'Geist';src:url('./fonts/Geist-Variable.woff2') format('woff2');font-weight:100 900;font-display:swap}
  :root{
    --bg:#0a0a0a; --card:#171717; --panel-2:#262626; --line:rgb(255 255 255 / .07);
    --text:#f0f0f0; --muted:#acacac; --dim:#737373;
    --run:#d4a300; --ok:#10b981; --merge:#51a2ff;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.6 'Geist',-apple-system,'Segoe UI',sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;
    background:rgba(10,10,10,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  header b{font-size:13px;font-weight:600}
  header .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px}
  main{padding:20px 16px 96px;max-width:1180px;margin:0 auto}
  h2{font-size:13px;font-weight:600;color:var(--muted);margin:26px 0 10px;letter-spacing:.02em}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:10px}
  .card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;
    transition:border-color .15s,background .15s}
  .card:hover{border-color:rgb(255 255 255 / .16)}
  .card input{position:absolute;opacity:0;pointer-events:none}
  .card.is-on{border-color:rgb(81 162 255 / .55);background:#161b22}
  .card svg{display:block;width:100%;height:96px;margin-bottom:8px;background:#101010;border-radius:6px}
  .card b{display:block;font-size:12.5px;font-weight:600}
  .card span{display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
  footer{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 16px;
    background:rgba(23,23,23,.96);border-top:1px solid var(--line)}
  footer code{font-family:'SF Mono',ui-monospace,monospace;font-size:11.5px;color:var(--muted)}
  footer button{margin-left:auto;height:30px;padding:0 14px;border-radius:6px;border:1px solid var(--input,#fff2);
    background:#e5e5e5;color:#171717;font:inherit;font-weight:600;cursor:pointer}
  .note{font-size:11.5px;color:var(--dim);margin:6px 0 0}

  /* ---------- node ---------- */
  @keyframes ringOut{0%{r:5;opacity:.85}70%{r:13;opacity:0}100%{r:13;opacity:0}}
  .n1-ring{animation:ringOut 2s ease-out infinite}
  @keyframes breathe{0%,100%{r:6;opacity:.35}50%{r:9.5;opacity:.7}}
  .n2-glow{animation:breathe 2.4s ease-in-out infinite}
  @keyframes blink{0%,45%{opacity:1}50%,95%{opacity:.25}100%{opacity:1}}
  .n4-dot{animation:blink 1.6s ease-in-out infinite}
  @keyframes bar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
  .n4-bar{transform-origin:center bottom;animation:bar 1s ease-in-out infinite}
  .n4-b2{animation-delay:.18s} .n4-b3{animation-delay:.36s}

  /* ---------- merge ---------- */
  @keyframes dash{to{stroke-dashoffset:-24}}
  .m1-flow{stroke-dasharray:7 5;animation:dash .9s linear infinite}
  .m3-flow{stroke-dasharray:2 6;animation:dash 1.1s linear infinite}
  @keyframes hop{0%,100%{transform:translateY(-1.5px)}50%{transform:translateY(1.5px)}}
  .m3-head{animation:hop 1.1s ease-in-out infinite}
  @keyframes draw{0%{stroke-dashoffset:180}60%,100%{stroke-dashoffset:0}}
  .m4-draw{stroke-dasharray:180;animation:draw 2.2s ease-in-out infinite}

  /* ---------- loop ---------- */
  @keyframes marquee{to{stroke-dashoffset:-22}}
  .l1-ring{stroke-dasharray:4 4;animation:marquee 1s linear infinite}
  @keyframes arcPulse{0%,100%{opacity:.35}50%{opacity:1}}
  .l3-arc{stroke-dasharray:3 4;animation:arcPulse 1.2s ease-in-out infinite}

  @media (prefers-reduced-motion: reduce){
    .n1-ring,.n2-glow,.n4-dot,.n4-bar,.m1-flow,.m3-flow,.m3-head,.m4-draw,.l1-ring,.l3-arc{animation:none}
    .m4-draw{stroke-dashoffset:0}
  }
</style>
</head>
<body>
<header>
  <b>ADE 애니메이션 시안</b>
  <span class="tag">MOCKUP</span>
  <span class="note">카테고리마다 하나씩 고르세요. 고른 조합으로 목업을 고칩니다.</span>
</header>

<main>
  <h2>1. 노드 상태 (세션 점)</h2>
  <div class="grid" data-cat="node">
    <label class="card">
      <input type="radio" name="node" value="N1" />
      <svg viewBox="0 0 160 96" aria-hidden="true">
        <circle cx="80" cy="48" r="5" fill="none" stroke="#d4a300" stroke-width="1.6" class="n1-ring"/>
        <circle cx="80" cy="48" r="5" fill="#d4a300"/>
      </svg>
      <b>N1 · 확산 링</b><span>실행 중 표시에서 링이 퍼져 나감</span>
    </label>
    <label class="card">
      <input type="radio" name="node" value="N2" />
      <svg viewBox="0 0 160 96" aria-hidden="true">
        <circle cx="80" cy="48" r="6" fill="#d4a300" opacity=".35" class="n2-glow"/>
        <circle cx="80" cy="48" r="5" fill="#d4a300"/>
      </svg>
      <b>N2 · 호흡 글로우</b><span>부드럽게 커졌다 작아지는 후광</span>
    </label>
    <label class="card">
      <input type="radio" name="node" value="N3" />
      <svg viewBox="0 0 160 96" aria-hidden="true">
        <circle cx="80" cy="48" r="5" fill="#d4a300"/>
        <circle r="1.8" fill="#f0f0f0"><animateMotion dur="2s" repeatCount="indefinite" path="M69 48 a 11 11 0 1 1 22 0 a 11 11 0 1 1 -22 0"/></circle>
      </svg>
      <b>N3 · 궤도 스파크</b><span>노드 주위를 작은 점이 돎</span>
    </label>
    <label class="card">
      <input type="radio" name="node" value="N4" />
      <svg viewBox="0 0 160 96" aria-hidden="true">
        <circle cx="66" cy="48" r="5" fill="#d4a300" class="n4-dot"/>
        <rect x="80" y="40" width="3" height="16" rx="1.5" fill="#d4a300" class="n4-bar"/>
        <rect x="87" y="40" width="3" height="16" rx="1.5" fill="#d4a300" class="n4-bar n4-b2"/>
        <rect x="94" y="40" width="3" height="16" rx="1.5" fill="#d4a300" class="n4-bar n4-b3"/>
      </svg>
      <b>N4 · 점멸 + 게이지</b><span>점이 깜빡이고 옆 막대가 요동침</span>
    </label>
  </div>
  <p class="note">N3·N4는 시선을 더 끄는 대신 여러 노드가 동시에 실행 중이면 산만해집니다.</p>

  <h2>2. 머지 (자식 → 부모)</h2>
  <div class="grid" data-cat="merge">
    <label class="card">
      <input type="radio" name="merge" value="M1" />
      <svg viewBox="0 0 160 96" aria-hidden="true">
        <path d="M40 80 L40 34 L120 34" fill="none" stroke="#51a2ff" stroke-width="1.6" class="m1-flow"/>
        <circle r="2.4" fill="#51a2ff"><animateMotion dur="1.8s" repeatCount="indefinite" path="M40 80 L40 34 L120 34"/></circle>
      </svg>
      <b>M1 · 점선 흐름 + 점</b><span>현재 목업에 적용된 방식</span>
    </label>
    <label class="card">
      <input type="radio" name="merge" value="M2" />
      <svg viewBox="0 0 160 96" aria-hidden="true">
        <path id="m2p" d="M40 80 L40 34 L120 34" fill="none" stroke="#51a2ff" stroke-width="1.4" stroke-dasharray="1 4"/>
        <circle r="2.4" fill="#51a2ff"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#m2p"/></animateMotion></circle>
        <circle r="1.8" fill="#51a2ff" opacity=".55"><animateMotion dur="1.8s" begin="-.25s" repeatCount="indefinite"><mpath href="#m2p"/></animateMotion></circle>
        <circle r="1.2" fill="#51a2ff" opacity=".28"><animateMotion dur="1.8s" begin="-.5s" repeatCount="indefinite"><mpath href="#m2p"/></animateMotion></circle>
      </svg>
      <b>M2 · 꼬리 혜성</b><span>같은 선을 여러 점이 시차를 두고 따라감</span>
    </label>
    <label class="card">
      <input type="radio" name="merge" value="M3" />
      <svg viewBox="0 0 160 96" aria-hidden="true">
        <path d="M40 80 L40 34 L112 34" fill="none" stroke="#51a2ff" stroke-width="1.6" class="m3-flow"/>
        <path d="M112 27 L124 34 L112 41 z" fill="#51a2ff" class="m3-head"/>
      </svg>
      <b>M3 · 화살촉 맥동</b><span>선은 점선 흐름, 화살촉이 살짝 오르내림</span>
    </label>
    <label class="card">
      <input type="radio" name="merge" value="M4" />
      <svg viewBox="0 0 160 96" aria-hidden="true">
        <path d="M40 80 L40 34 L120 34" fill="none" stroke="#51a2ff" stroke-width="2" class="m4-draw"/>
        <path d="M120 28 L130 34 L120 40 z" fill="#51a2ff" opacity=".7"/>
      </svg>
      <b>M4 · 그어지기</b><span>선이 처음부터 다시 그려지며 진행</span>
    </label>
  </div>
  <p class="note">M4는 "지금 막 시작" 느낌이 강해 반복 재생되면 다소 산만합니다.</p>

  <h2>3. 루프 (자기 반복)</h2>
  <div class="grid" data-cat="loop">
    <label class="card">
      <input type="radio" name="loop" value="L1" />
      <svg viewBox="0 0 160 96" aria-hidden="true">
        <circle cx="80" cy="48" r="12" fill="none" stroke="#d4a300" stroke-width="1.6" class="l1-ring"
          stroke-dashoffset="0" transform="rotate(-90 80 48)"/>
        <circle cx="80" cy="48" r="5" fill="#d4a300"/>
      </svg>
      <b>L1 · 회전 링</b><span>링 자체가 돌고, 가운데 노드는 고정</span>
    </label>
    <label class="card">
      <input type="radio" name="loop" value="L2" />
      <svg viewBox="0 0 160 96" aria-hidden="true">
        <circle cx="80" cy="48" r="5" fill="#d4a300"/>
        <circle r="2.6" fill="#d4a300"><animateMotion dur="1.4s" repeatCount="indefinite" path="M69 48 a 11 11 0 1 1 22 0 a 11 11 0 1 1 -22 0"/></circle>
      </svg>
      <b>L2 · 궤도 점</b><span>링 없이 점만 노드 주위를 돎</span>
    </label>
    <label class="card">
      <input type="radio" name="loop" value="L3" />
      <svg viewBox="0 0 160 96" aria-hidden="true">
        <path d="M68 48 A 12 12 0 0 1 92 48" fill="none" stroke="#d4a300" stroke-width="1.6" class="l3-arc"/>
        <circle r="2.4" fill="#d4a300"><animateMotion dur="2s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear" path="M68 48 A 12 12 0 0 1 92 48"/></circle>
      </svg>
      <b>L3 · 왕복 호</b><span>호 위를 앞뒤로 오감(진자)</span>
    </label>
    <label class="card">
      <input type="radio" name="loop" value="L4" />
      <svg viewBox="0 0 160 96" aria-hidden="true">
        <path id="l4p" d="M80 36 A 12 12 0 1 1 79.9 36" fill="none" stroke="#d4a300" stroke-width="1.2" opacity=".45"/>
        <circle r="2.4" fill="#d4a300"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#l4p"/></animateMotion></circle>
        <circle r="2" fill="#d4a300" opacity=".6"><animateMotion dur="1.6s" begin="-.8s" repeatCount="indefinite"><mpath href="#l4p"/></animateMotion></circle>
        <circle cx="80" cy="48" r="5" fill="#d4a300"/>
      </svg>
      <b>L4 · 쌍둥이 추격</b><span>두 점이 반대편에서 같은 링을 돎</span>
    </label>
  </div>
  <p class="note">L1은 정지 화면에서도 "반복 중"이 읽혀 가장 안전합니다.</p>
</main>

<footer>
  <code id="pick">node – · merge – · loop –</code>
  <button type="button" id="apply">이 조합 정보 복사</button>
</footer>

<script>
  var state = { node: "", merge: "", loop: "" };
  function cardOf(el) { return el.closest(".card"); }
  function syncPick() {
    var el = document.getElementById("pick");
    el.textContent = "node " + (state.node || "-") + " · merge " + (state.merge || "-") + " · loop " + (state.loop || "-");
  }
  Array.prototype.forEach.call(document.querySelectorAll(".grid"), function (grid) {
    grid.addEventListener("change", function (e) {
      var input = e.target;
      if (!input || input.type !== "radio") return;
      state[grid.dataset.cat] = input.value;
      Array.prototype.forEach.call(grid.querySelectorAll(".card"), function (c) {
        c.classList.toggle("is-on", c.contains(input));
      });
      syncPick();
    });
  });
  document.getElementById("apply").addEventListener("click", function () {
    var text = JSON.stringify(state);
    var btn = this;
    try {
      navigator.clipboard.writeText(text);
      btn.textContent = "복사됨: " + text;
      setTimeout(function () { btn.textContent = "이 조합 정보 복사"; }, 1800);
    } catch (err) {
      btn.textContent = text;
    }
  });
  syncPick();
</script>
</body>
</html>
